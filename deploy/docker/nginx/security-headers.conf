# SAR-20 security headers (docs/05-ARCHITECTURE.md §6; REQ-SEC-004), on every response including
# errors (`always`). The values equal SECURITY_HEADERS in frontend/vite.config.ts, which vite preview
# serves for e2e (docs/dev-guide.md DG-RUN-23). nginx replaces inherited add_header directives in any
# location that sets its own, so default.conf includes this file in every location.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# 05 SAR-20 rev 1.53: sent only by a server that terminates TLS ($erev_hsts is empty elsewhere and
# nginx omits a header with an empty value); see the map in default.conf.
add_header Strict-Transport-Security $erev_hsts always;
