# nginx server of the web image (docs/05-ARCHITECTURE.md §8.1 DPL-03, §8.2 DPL-12; SAR-20;
# REQ-SEC-001). Serves the built SPA on 8080 as uid 101 and proxies /api/ to the api service. Body
# limits (§2.5 step 3; T-PLT-29; API-C-17): 1m by default; 501m for /api/v1/files, the one multipart upload
# route, admitting the largest purpose (LEGACY_DATABASE 500 MiB) plus the api's 64 KiB multipart envelope —
# nginx admits; the api checks the declared request envelope before reading, counts received bytes, and
# enforces each file's purpose limit during processing before persistent storage; 1m for the JSON routes
# (/api/v1/attachments, /api/v1/imports, /api/v1/migrations: file ids, not bytes). There is no /metrics location.

# The client's X-Request-Id when it sent one, else nginx's own request id (API-C-02 accepts both).
map $http_x_request_id $erev_request_id {
    default $http_x_request_id;
    "" $request_id;
}

# Hashed build assets never change, so an asset that is served is cached for a year. One that is not
# there must never be cached: during a rolling deploy a new index.html names assets an older
# instance does not hold yet, and a 404 carrying `immutable` (what a single `always` header gave
# every status) would pin that failure in the browser for a year.
map $status $erev_asset_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

# Strict-Transport-Security belongs to the tier that terminates TLS (05 SAR-20 rev 1.53). nginx sends
# it on every response of a server that terminates TLS itself ($https is "on" there) and on none of
# the plain-HTTP server below, where a browser would ignore it; add_header omits a header whose
# value is empty. security-headers.conf carries the header line, so every location has it.
map $https $erev_hsts {
    default "";
    on "max-age=31536000; includeSubDomains";
}

# The api upstream is resolved when a request is proxied, not when nginx starts (05 DPL-12 rev
# 1.53). A variable in proxy_pass makes nginx ask the resolver, and 127.0.0.11 is the DNS of
# every compose network, so nginx follows an api container that compose recreated on another
# address (a changed variable, a new image) within `valid`, and the image starts where nothing
# is named api: the hosted web service, where the load balancer routes /api/ to the api service
# and these locations are never reached (DPL-03, DPL-40). With the name written into proxy_pass
# nginx resolved it once, at start, answered 502 after the api had moved, and refused to start
# without it (host not found in upstream). Where no resolver answers at that address - outside a
# compose network - a request to a proxy location is answered 502 after resolver_timeout.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 8080;
    server_name _;
    set $erev_api http://api:8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Hashed build assets: a year for a served asset, no-store for anything else (map above).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $erev_asset_cache_control always;
        try_files $uri =404;
    }

    # The SPA: unknown paths render index.html, whose router shows NotFound (RT-98).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 1m;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
        proxy_pass $erev_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $erev_request_id;
    }

    location /api/v1/files {
        client_max_body_size 501m;
        # 05 DPL-12 rev 1.128 (ruling R-111 (8)): the api authenticates an upload before it reads
        # the body. With request buffering on, nginx would store the whole body first and hand
        # the request over only then; off, the body reaches the api as it arrives and a client
        # without a session is answered before anything is stored.
        proxy_request_buffering off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
        proxy_pass $erev_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $erev_request_id;
    }

    location /api/v1/attachments {
        client_max_body_size 1m;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
        proxy_pass $erev_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $erev_request_id;
    }

    location /api/v1/imports {
        client_max_body_size 1m;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
        proxy_pass $erev_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $erev_request_id;
    }

    location /api/v1/migrations {
        client_max_body_size 1m;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
        proxy_pass $erev_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $erev_request_id;
    }
}

# Self-hosted HTTPS (REQ-SEC-001). Compose binds plain HTTP to 127.0.0.1 only (DPL-12); to serve other
# hosts, terminate TLS 1.2 or later here, mount the certificate and key read-only, publish 8443 and
# repeat the locations above inside this server. Every response of this server then carries
# `Strict-Transport-Security: max-age=31536000; includeSubDomains` through the $erev_hsts map and
# security-headers.conf. Do not add the header at server level: nginx drops inherited add_header
# lines in a location that sets its own, and every location here does. When another proxy terminates
# TLS in front of this container, that proxy must send the header; this server then speaks plain
# HTTP and sends none. Set EREV_PUBLIC_ORIGIN to the https origin (05 CFG-09): links, the CSRF
# origin check and the session cookie follow it (SAR-09).
#
# server {
#     listen 8443 ssl;
#     http2 on;
#     server_name erev.example.com;
#     server_tokens off;
#     ssl_certificate /etc/nginx/tls/fullchain.pem;
#     ssl_certificate_key /etc/nginx/tls/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_timeout 1d;
#     ssl_session_tickets off;
#     root /usr/share/nginx/html;
#     client_max_body_size 1m;
#     set $erev_api http://api:8080;   # the proxy locations pass to this variable
#     # ... the locations of the server above ...
# }
