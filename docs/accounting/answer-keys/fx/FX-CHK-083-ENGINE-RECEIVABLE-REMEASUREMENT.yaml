schema: "erev-answer-key/1"
id: FX-CHK-083-ENGINE-RECEIVABLE-REMEASUREMENT
title: >-
  ENGINE billing: EUR receivable remeasured at the closing rate; liability stays at the historical layer
status: active
families: [FX, JE]
tags: [fx]
summary: >-
  Entity US01 (functional USD), billing.posting ENGINE. A EUR 12,000 subscription for 2026 is invoiced on 1 January
  (noncancellable, spot 1.1000): JET-03 Dr ACCOUNTS_RECEIVABLE / Cr CONTRACT_LIABILITY EUR 12,000 = USD 13,200.00,
  creating the liability layer at that rate. January revenue EUR 1,000 relieves USD 1,100.00. The receivable is unpaid
  at 31 January and is remeasured at the closing rate 1.1200: USD 13,440.00, so JET-10a′ posts Dr ACCOUNTS_RECEIVABLE
  240.00 / Cr FX_GAIN_LOSS 240.00 (CHK-083). The contract liability EUR 11,000 stays at USD 12,100.00.
