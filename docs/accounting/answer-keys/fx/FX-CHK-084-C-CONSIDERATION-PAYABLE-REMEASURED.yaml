id: FX-CHK-084-C-CONSIDERATION-PAYABLE-REMEASURED
title: >-
  D-25b: EUR consideration payable remeasured at closing; the customer incentive asset stays at the promise-date rate
  (CHK-084 c)
status: active
families: [FX, CPC, JE]
tags: [fx]
summary: >-
  POLICIES CHK-084 (c); entity US01 (functional USD), EUR contract, ERP billing. On 1 June 2026 the entity promises
  the customer EUR 50,000.00 before any related revenue (booking member consideration_payable, committed purchases
  500,000.00): JET-14 Dr CUSTOMER_INCENTIVE_ASSET / Cr CONSIDERATION_PAYABLE USD 55,000.00 at spot 1.1000. The payable
  is unsettled at 30 June; it is a monetary item (D-25b), so at closing 1.0900 JET-10d Dr CONSIDERATION_PAYABLE / Cr
  FX_GAIN_LOSS USD 500.00 (carrying 54,500.00). The incentive asset is nonmonetary and stays at 55,000.00 (POLICIES B3
  decision 5: an open promise is remeasured at every period end until a settlement is recorded).
