id: FX-CHK-082-REFUNDABLE-ADVANCE-MONETARY-OVERRIDE-VS-IFRIC22
title: >-
  Refundable EUR advance: monetary remeasurement under the ASC606 override, historical layer in IFRS15
status: active
families: [FX, IFRS]
tags: [fx]
summary: >-
  Entity US01 (functional USD), EUR 12,000 subscription for 2026 invoiced in full on 1 January (spot 1.1000) and
  refundable in cash for undelivered months, ERP billing. An approved contract-level override sets POL-163
  fx.cl_historical_layering = DISABLED_REMEASURE_AS_MONETARY (D-25a), which applies only to the ASC606 book. ASC606:
  January revenue EUR 1,000 at the January average 1.1100 = USD 1,110.00; carrying 13,200.00 − 1,110.00 = 12,090.00;
  the open EUR 11,000 at closing 1.1200 = 12,320.00, so JET-10b posts Dr FX_GAIN_LOSS 230.00 / Cr CONTRACT_LIABILITY
  230.00 (CHK-082). IFRS15 forces IFRIC 22 historical layering: revenue USD 1,100.00, contract liability USD 12,100.00
  and no FX line.
