summary: >-
  Entity BH01 (functional BHD, ISO 4217 exponent 3) sells a USD 10,000.00 three-month service (2026-01-01 to
  2026-03-31, MONTHLY_EVEN) invoiced upfront at spot USD/BHD 0.376000 (layer BHD 3,760.000), ERP billing. Transaction
  revenue 3,333.33 / 3,333.34 / 3,333.33. Functional relief rounds the layer share to the fils: January round(3,760 ×
  0.333333) = 1,253.332, February 1,253.336 (cumulative 2,506.668), March 1,253.332, ending at exactly zero (C-06).
