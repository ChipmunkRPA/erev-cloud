id: FX-CHK-084-A-REFUND-LIABILITY-REMEASURED
title: >-
  D-25b: EUR refund liability created at spot, remeasured at closing and at settlement, released at window expiry
  (CHK-084 a)
status: active
families: [FX, RET, JE]
tags: [fx]
summary: >-
  POLICIES CHK-084 (a); entity US01 (functional USD), EUR contract, ERP billing, the same figures in every book
  (D-25b). On 1 March 2026 100 units transfer for EUR 10,000.00, invoiced and received that day at spot 1.1000:
  contract-liability layer USD 11,000.00. Expected returns are 3 units at 100.00 (RETURN_RATE; carrying and recovery
  cost equal, so no return asset). JET-02 revenue EUR 9,700.00 relieves USD 10,670.00; JET-04b Dr CONTRACT_LIABILITY /
  Cr REFUND_LIABILITY EUR 300.00 = USD 330.00 at spot. 31 March, closing 1.1200: JET-10d loss 6.00 (carrying 336.00).
  15 April: two units are returned and credited EUR 200.00 at spot 1.1500; the settled carrying share 224.00 is
  remeasured to 230.00 (loss 6.00) and JET-04b releases 230.00 against the liability the ERP credit memo debits. 30
  April, closing 1.0800: gain 4.00 (carrying 108.00 for EUR 100.00). 31 May the return window expires at 1.1000: loss
  2.00; JET-04b releases 110.00 to the contract liability and JET-04a recognises revenue EUR 100.00 = USD 110.00.
  Totals: revenue USD 10,780.00, net FX loss 10.00, refund liability 0.00 (ALG-08 §2.9.1; JET-10d).
