schema: "erev-answer-key/1"
id: FX-POL-160-IFRIC22-LAYER-DATE-ASC606-VS-IFRS15
title: >-
  Layer date: invoice issue date elected in the ASC606 book, IFRIC 22 earlier of receipt and due in IFRS15
status: active
families: [FX, IFRS]
tags: [fx, r04-s13]
summary: >-
  Entity US01 (functional USD), ERP billing. A EUR 12,000 subscription for 2026 is invoiced on 1 January (spot
  1.0900), due 31 January and noncancellable; the customer pays on 10 January (spot 1.1000). US01 elects POL-160
  fx.cl_layer_date = INVOICE_ISSUE_DATE, which the IFRS15 book cannot use (FORCED
  EARLIER_OF_RECEIPT_AND_UNCONDITIONAL_DUE). ASC606: layer USD 13,080.00, monthly revenue USD 1,090.00. IFRS15 (IFRIC
  22.8, the date the advance is first recognised = earlier of payment and due date): layer USD 13,200.00, monthly
  revenue USD 1,100.00. Contract liability at 31 March: EUR 9,000 in both books, USD 9,810.00 (ASC606) against
  9,900.00 (IFRS15). No FX line in either book.
