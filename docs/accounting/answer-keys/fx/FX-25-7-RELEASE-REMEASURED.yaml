summary: "Entity US01 (functional USD), a EUR contract of 3,000.00 for two goods (G1 2,000.00, SSP 2,000; G2 1,000.00, SSP 1,000; posted allocation 200,000 : 100,000 minor) booked on 5 January 2026 while collectibility is not probable (NOT_A_CONTRACT). EUR 1,000.00 is received on 10 January at spot 1.1000: JET-01b Dr BILLING_CLEARING UNAPPLIED_CASH / Cr DEPOSIT_LIABILITY USD 1,100.00; the deposit is a monetary item (D-25b): 31 January closing 1.1200, JET-10d loss 20.00 (1,100.00 to 1,120.00). The reviewed NOT_A_CONTRACT record is nonrefundable with event_c_met_on 15 February 2026: the deposit is derecognised at that dated point at spot 1.1300, JET-10d loss 10.00 (1,120.00 to 1,130.00), then Dr DEPOSIT_LIABILITY EUR 1,000.00 / Cr REVENUE EUR 1,000.00 functional 1,130.00 (S12-R-20; CHK-084 (b) rates), attributed to the two obligations by largest remainder over the posted inception allocation (S14-R-25): transaction [666.67, 333.33], functional [753.33, 376.67] over the same weights (D-91 gaps (iv), the corrected FX2 figures: release 100,000 / 113,000 minor, JET-10d 2,000 at the close and 1,000 at settlement, total 3,000, split [75,333, 37,667]). The release is a TIME amount of the CLOSE_RELEASE pass."
