schema: "erev-answer-key/1"
id: FX-CHK-080-LIABILITY-LAYERS-AT-HISTORICAL-RATES
title: >-
  Contract liability layers at historical rates: two EUR advances consumed first in, first out
status: active
families: [FX, IFRS]
tags: [fx]
summary: >-
  Entity US01 (functional USD) sells a EUR 12,000 platform subscription for 2026 (MONTHLY_EVEN, EUR 1,000 a month) and
  invoices EUR 6,000 on 1 January (spot 1.1000) and EUR 6,000 on 1 July (spot 1.2000), ERP billing. Each advance
  creates a nonmonetary liability layer measured once at its date (D-25; POL-160, POL-161 FIFO): L1 USD 6,600.00 and
  L2 USD 7,200.00. Revenue relieves the layers at their historical rates: USD 1,100.00 a month from L1 in January to
  June and USD 1,200.00 a month from L2 in July to December; L1 reaches exactly zero on 30 June; no FX line arises and
  annual revenue is USD 13,800.00 (CHK-080). The IFRS15 book reaches the same figures because IFRIC 22 sets each
  advance's transaction date at initial recognition. Average and closing rates are published but unused because no
  asset position ever arises.
