schema: "erev-answer-key/1"
id: FX-CHK-084-B-DEPOSIT-LIABILITY-REMEASURED
title: >-
  D-25b: EUR deposit received while not a contract remeasured until criteria are met, then layered at the
  transfer-date spot (CHK-084 b)
status: active
families: [FX, STP1, JE]
tags: [fx]
summary: >-
  POLICIES CHK-084 (b); entity US01 (functional USD), EUR contract, ERP billing. Collectibility is not probable at
  booking, so the contract is NOT_A_CONTRACT. EUR 1,000.00 is received on 10 January 2026 at spot 1.1000: JET-01b Dr
  BILLING_CLEARING (UNAPPLIED_CASH) / Cr DEPOSIT_LIABILITY USD 1,100.00. The deposit is a monetary item (D-25b): 31
  January, closing 1.1200, JET-10d loss 20.00. CONTRACT_CRITERIA_MET on 15 February at spot 1.1300 settles the
  deposit: JET-10d loss 10.00, then JET-01b Dr DEPOSIT_LIABILITY / Cr CONTRACT_LIABILITY USD 1,130.00, which creates a
  contract-liability layer of EUR 1,000.00 at 1,130.00 (IFRIC 22.8; POLICIES B3 decision 4). The contract liability is
  nonmonetary and is not remeasured afterwards.
