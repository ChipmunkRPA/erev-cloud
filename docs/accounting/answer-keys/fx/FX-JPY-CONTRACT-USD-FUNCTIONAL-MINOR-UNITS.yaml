summary: >-
  Entity US01 (functional USD) sells a JPY 1,000,000 licence-support service for 2026-04-01 to 2026-06-30 (91 days,
  DAILY), invoiced upfront at spot JPY/USD 0.006700 (layer USD 6,700.00), ERP billing. Transaction amounts round to
  yen (ISO 4217 exponent 0, C-06): April round(1,000,000 × 30 ÷ 91) = 329,670, May 340,660, June 329,670. Functional
  relief is the cumulative-rounded share of the layer at the cent: April USD 2,208.79, May 2,282.42, June 2,208.79, so
  the layer ends at exactly zero.
