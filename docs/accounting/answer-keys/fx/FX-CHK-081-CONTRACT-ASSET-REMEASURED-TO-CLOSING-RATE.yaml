schema: "erev-answer-key/1"
id: FX-CHK-081-CONTRACT-ASSET-REMEASURED-TO-CLOSING-RATE
title: >-
  Contract asset remeasured at closing rates with the difference to FX_GAIN_LOSS; settled at invoice spot
status: active
families: [FX, POS, JE]
tags: [fx]
summary: >-
  Entity US01 (functional USD), EUR 12,000 subscription for 2026 billed quarterly in arrears, ERP billing. [A] The
  customer may cancel before quarter end without paying for the elapsed months, so the right is CONDITIONAL and the
  debit position is a contract asset. January revenue EUR 1,000 creates asset layer A1 at the January average 1.1100
  (USD 1,110.00; POL-162); the closing rate 1.1200 remeasures A1 to 1,120.00 and JET-10a posts Dr CONTRACT_LIABILITY
  10.00 / Cr FX_GAIN_LOSS 10.00; JET-06 presents a contract asset of EUR 1,000 (USD 1,120.00). February adds A2 at
  1.1300 and remeasures EUR 2,000 at 1.1400 to 2,280.00 (gain 30.00). On 31 March the March revenue creates A3 at
  1.1500 (1,150.00), then the EUR 3,000 invoice at spot 1.1600 settles every asset layer: USD 3,480.00 against
  carrying 3,430.00, gain 50.00 (CHK-081). Totals: revenue USD 3,390.00, FX gain USD 90.00. [J] Time-elapsed revenue
  of a period is released before same-day billing on the period's last day.
