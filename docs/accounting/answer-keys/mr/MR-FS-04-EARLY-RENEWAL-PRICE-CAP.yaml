schema: erev-answer-key/1
id: MR-FS-04-EARLY-RENEWAL-PRICE-CAP
title: "Renewal price cap below SSP is a material right; early renewal exercised under CONTINUATION"
status: active
families: [MR, ALC, REC, POS]
tags: [subscription]
summary: "A 2026 subscription for 100,000.00 (SSP 100,000.00) includes an option to renew for 2027 at a price capped at 75,000.00. Expected renewal list value 100,000.00; discount on exercise 25%; a 5% discount is available to any customer without the contract, so the incremental discount is 20%; likelihood of exercise 80% (estimate version). Option SSP = 100,000.00 × 0.20 × 0.80 = 16,000.00 (606-10-55-44, D-21a). Allocation over total SSP 116,000.00 by largest remainder: subscription 86,206.90, material right 13,793.10. On 1 October 2026 the customer renews early and is invoiced 75,000.00. Under POL-028 CONTINUATION the option POB closes and a 2027 subscription POB is created with allocation 13,793.10 + 75,000.00 = 88,793.10, recognised over 2027; other POBs keep their allocations (ALG-05 §2.6.2)."
