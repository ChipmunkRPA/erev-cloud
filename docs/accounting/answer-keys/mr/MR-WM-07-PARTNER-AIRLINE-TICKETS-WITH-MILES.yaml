schema: erev-answer-key/1
id: MR-WM-07-PARTNER-AIRLINE-TICKETS-WITH-MILES
title: "Block-space airline tickets with loyalty miles: no-show breakage at departure, miles released on redemption"
status: active
families: [MR, BRK, POB, REC]
tags: [portfolio]
summary: "research 05 §18 worked example. Wayfarer's charter brand buys block space on a partner airline and resells seats, bearing inventory risk and setting fares, so it is principal for the flights (judgement). In January 2026 it sells 10,000 non-refundable tickets at 500.00 for March departures; each ticket earns 1,000 Wayfarer miles worth 0.012 each with an expected redemption rate of 80%. Option SSP = expected purchase amount 120,000.00 × 100% × 0.80 = 96,000.00 (9.60 a ticket). Allocation: flights 4,905,808.48, miles 94,191.52 (490.58 and 9.42 a ticket). The 2% of passengers who do not show lose their rights at departure, so their share is recognised then. Miles: 4,000,000 redeemed in Q3 against 8,000,000 expected (47,095.76); cumulative 7,200,000 in Q4 with the expected total revised to 7,500,000 (Q4 43,328.10; contract liability 3,767.66)."
