title: "Customer loyalty points: allocation on relative SSP and revenue as points are redeemed with a revised estimate (FASB Example 52)"
status: "active"
families: ["MR", "BRK", "REC"]
summary: "Retail sales of 100,000.00 earn 10,000 points worth 1.00 each; 9,500 are expected to be redeemed, so the points' SSP is 9,500 (10,000.00 x 100% x 95%). Allocation: sales 91,324.20, points 8,675.80 (exact 8,675.7990...). Revenue on points to date = exact points allocation x cumulative redemptions / expected redemptions, cumulatively rounded (POL-055; D-11a). January: 4,500 redeemed of 9,500 expected: 4,109.59; contract liability 4,566.21. February: 8,500 redeemed and the estimate revised to 9,700: cumulative round(8,675.7990... x 8,500 / 9,700) = 7,602.50, so February revenue 3,492.91 and the contract liability 1,073.30. POLICIES CHK-053 and research 04 show 3,492.92 and 1,073.29 because they multiply the posted allocation 8,675.80; D-11a rounds the exact cumulative amount (see coverage discrepancies)."
