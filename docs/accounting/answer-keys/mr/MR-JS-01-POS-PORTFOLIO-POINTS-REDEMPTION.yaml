summary: "research 05 §9 worked example. Juniper Street's January 2026 point-of-sale sales of 1,000,000.00 are processed as one portfolio (606-10-10-4; POL-015) and earn 1,000,000 points redeemable for free drinks worth 0.01 per point. Option SSP = expected purchase amount 10,000.00 × incremental discount 100% × likelihood 80% = 8,000.00 (D-21a). Allocation over SSPs 1,000,000.00 and 8,000.00 by largest remainder: goods 992,063.49, points 7,936.51. Points revenue = allocation × cumulative redemptions ÷ expected total redemptions (POL-055, ALG-05 §2.6.2): 400,000 of 800,000 in Q1 (3,968.25); 700,000 of a re-estimated 900,000 in Q2 (cumulative 6,172.84; Q2 2,204.59); unredeemed points expire on 30 September after 880,000 redemptions and the remaining 1,763.67 is recognised (JET-08). The inception allocation is not redone when the redemption estimate changes; only the cumulative measure moves."
