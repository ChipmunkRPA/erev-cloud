summary: "100 one-year maintenance contracts at 1,000.00 give customers renewals at 1,000.00 for years 2 and 3 while non-customers pay more: a material right. The entity applies the practical alternative (606-10-55-45) to the cohort as one contract (portfolio approach): expected consideration 100,000.00 + 90,000.00 (90 renewals) + 81,000.00 (81 renewals) = 271,000.00, allocated in proportion to expected costs adjusted for renewal likelihood (60,000 / 67,500 / 81,000): 77,985.61 / 87,733.81 / 105,280.58 with largest remainder. Each year is recognised by whole months. Contract liability: 22,014.39 at the end of 2026, 24,280.58 at the end of 2027, nil at the end of 2028. FASB presents whole-dollar per-contract amounts (780 / 877 / 1,053; 78,000 / 87,700 / 105,300); the engine allocates the cohort exactly (see coverage discrepancies)."
