summary: >-
  FASB Example 23 Case B (research 04 S3-EX23) with 20X7 and 20X8 re-anchored to 2026 and 2027. Entity US01, USD, ERP
  billing. 1,000 products at 100.00 transfer to a distributor on 2026-12-01; payment is due on resale, so the right is
  CONDITIONAL. The price concession (VARIABLE_CONSIDERATION, vc_element_type IMPLICIT_PRICE_CONCESSION, EXPECTED_VALUE
  40% = 40,000.00) is constrained to 50% (50,000.00) in version 1: revenue 50,000.00 and a 50,000.00 contract asset at
  31 December 2026. The distributor resells in February 2027 and the concession resolves at 45% (version 2 effective
  2027-02-15), invoiced 55,000.00: transaction price 55,000.00; JET-04a Dr CONTRACT_LIABILITY / Cr REVENUE 5,000.00;
  the obligation was satisfied in a previous period, so POL-204 reports 5,000.00 of revenue from obligations satisfied
  in previous periods for FY2027-P02 (CHK-101; 606-10-50-12A); trace ΔTP +5,000.00. Cross-slice variants with distinct
  inputs, kept: VC-CHK-101-S3-EX23-CASEB (different estimate versions and events) (ADJUDICATION.md R-DUP-02).
