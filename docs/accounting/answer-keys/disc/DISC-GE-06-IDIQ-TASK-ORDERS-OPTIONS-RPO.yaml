schema: erev-answer-key/1
id: DISC-GE-06-IDIQ-TASK-ORDERS-OPTIONS-RPO
title: "IDIQ vehicle: task orders are contracts; unexercised priced options excluded from the transaction price and RPO"
status: active
families: [DISC, STP1, REC, POS]
tags: []
summary: "An indefinite-delivery, indefinite-quantity vehicle (ceiling 20,000,000.00; minimum 500,000.00) creates no enforceable rights beyond the minimum until task orders are issued. Task order TO-1 (1 February 2026) buys 12 months of engineering support for a fixed 1,200,000.00 with two option years at 1,300,000.00 each; the options are priced at SSP, so they are not material rights and are excluded from the transaction price and from remaining performance obligations until exercised (606-10-55-42; research 05 §7 pitfall 1). Revenue 100,000.00 a month; monthly invoices on the 10th of the following month; the right for elapsed months is unconditional (termination for convenience pays for work performed), so uninvoiced months are unbilled receivables. RPO at 30 June 2026: 700,000.00. Option year 1 is exercised on 1 February 2027 at SSP and is a separate contract (606-10-25-12): RPO at 28 February 2027 is 1,191,666.67."
