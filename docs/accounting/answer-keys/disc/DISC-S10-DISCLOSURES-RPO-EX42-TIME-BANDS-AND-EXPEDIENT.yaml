summary: >-
  FASB Example 42 (606-10-55-298 to 55-305A) with 30 June 20X7 re-anchored to contracts running 2026-07-01 to
  2028-06-30 and the disclosure at 31 December 2026. Entity US01, USD, POL-201 bands [12, 24], POL-198
  rpo.exemption_right_to_invoice = APPLY at entity level. Contract A: cleaning at 25.00 per hour, RIGHT_TO_INVOICE [A
  480 expected hours], 120 hours performed; exempt, so it is excluded from the report although its engine RPO measure
  is 9,000.00. Contract B: 400.00 a month by time elapsed (MONTHLY_EVEN): RPO 7,200.00 = 4,800.00 within 12 months and
  2,400.00 in months 13 to 24. Contract C: 100.00 a month plus a bonus of up to 1,000.00 of which 750.00 is included
  (transaction price 3,150.00): RPO 2,362.50 = 1,575.00 and 787.50; the excluded constrained amount 250.00 feeds the
  50-15 narrative. Report total 9,562.50. [J] Cell keys: row_key = contract external_id or TOTAL; column_key =
  within_12_months, months_13_to_24, after_24_months, total (OQ-AK-11). Cross-slice variants with distinct inputs,
  kept: DISC-S10-DISCLOSURES-RPO-EX42 (different contracts and figures; platform runner) (ADJUDICATION.md R-DUP-02).
