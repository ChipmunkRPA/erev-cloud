title: "Noncash consideration (customer shares) at inception fair value with the JET-17 asset and receipt lines (CHK-135; FASB Example 31)"
status: "active"
families: ["NCC", "REC", "JE"]
summary: "A one-year weekly service is paid with 100 of the customer's shares per completed week (5,200 shares). The booking carries the promise as noncash_consideration (5,200 units at a fair value of 10.00 on 1 January 2026, variability FORM; dev-guide §9.5.4 rev 1.2), and the line carries no cash price: transaction price 52,000.00 (ENGINE_SPEC S04-R-02, S04-R-18; POL-048 CONTRACT_INCEPTION, 606-10-32-21 as amended by ASU 2016-12). Each completed week makes the right to 100 shares unconditional: Dr NONCASH_CONSIDERATION_ASSET / Cr CONTRACT_LIABILITY 1,000.00, and JET-02 recognises 1,000.00 of revenue. The week 1 shares arrive on 10 January (PAYMENT_RECEIVED, form NONCASH): Dr BILLING_CLEARING (INVESTMENTS) / Cr NONCASH_CONSIDERATION_ASSET 1,000.00 at carrying amount; their 12.00 price that day is the investments subledger's gain, never revenue (606-10-32-23; POLICIES CHK-135). January: four weeks, revenue 4,000.00, asset 3,000.00."
