schema: "erev-answer-key/1"
id: IFRS-SW01-COLLECTIBILITY-THRESHOLD-PER-BOOK
title: >-
  IFRS switch #1: collectibility probable in IFRS15 but not in ASC606; deposit liability in one book only
status: active
families: [IFRS, STP1, JE]
tags: [r04-s13]
summary: >-
  Research 04 §13 #1 (POL-011). Entity US01, USD, ERP billing. A 12-month service (12,000.00, MONTHLY_EVEN) with a
  customer whose collectibility is assessed as more likely than not but not likely to occur: the IFRS15 judgement
  concludes probable (IFRS 15.9(e), more likely than not) and the ASC606 judgement does not (606-10-25-1(e), likely to
  occur). The customer is invoiced and pays 1,000.00 on the first day of each month. ASC606 book: NOT_A_CONTRACT; each
  receipt posts JET-01b Dr BILLING_CLEARING (UNAPPLIED_CASH) / Cr DEPOSIT_LIABILITY 1,000.00; no revenue; deposit
  liability 3,000.00 at 31 March; each invoice raises INVOICE_ON_NOT_A_CONTRACT (WARNING) without posting. IFRS15
  book: ACTIVE; revenue 1,000.00 a month and no contract balance. [J] The reverse split (probable under US GAAP but
  not IFRS) cannot arise because the US threshold is the higher one.
