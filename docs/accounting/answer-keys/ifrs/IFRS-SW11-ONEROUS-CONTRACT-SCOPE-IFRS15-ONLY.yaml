  Research 04 §13 #11 (POL-151, POL-152). Entity US01, USD, ERP billing. A fixed-price software implementation of
  1,000,000.00 measured cost-to-cost with an EAC of 1,100,000.00 from inception [A]. By 2026-06-30 costs of 440,000.00
  give 40% progress and revenue 400,000.00, invoiced. ASC606 book: POL-151 SCOPED_605_35_ONLY and the contract is not
  a Subtopic 605-35 contract, so no provision. IFRS15 book (ALL_CONTRACTS_WITH_EAC forced; IAS 37.68A costs equal the
  EAC here [A]): total expected loss 100,000.00 less the 40,000.00 recognised through margin gives JET-12 Dr
  LOSS_EXPENSE 60,000.00 / Cr LOSS_PROVISION 60,000.00.
