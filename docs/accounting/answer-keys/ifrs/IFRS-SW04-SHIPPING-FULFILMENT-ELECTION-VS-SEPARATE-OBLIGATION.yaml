id: IFRS-SW04-SHIPPING-FULFILMENT-ELECTION-VS-SEPARATE-OBLIGATION
title: >-
  IFRS switch #4: shipping after control is a fulfilment activity in ASC606 (election) and an obligation in IFRS15
status: active
families: [IFRS, POB, REC]
tags: [r04-s13]
summary: >-
  Research 04 §13 #4 (POL-021). Entity US01, USD, ERP billing. An industrial pump (1,000.00, SSP 1,000.00) is sold FOB
  shipping point with delivery to the customer's site for 100.00 (SSP 100.00); control transfers at shipment on
  2026-03-28 and the carrier delivers on 2026-04-03; invoiced 1,100.00 at shipment. ASC606 book with
  pob.shipping_as_fulfilment = TRUE (606-10-25-18B): the freight charge joins the pump obligation, revenue 1,100.00 in
  March and no contract liability; the carrier cost accrual is an ERP posting. IFRS15 forces FALSE: two obligations
  allocated 1,000.00 and 100.00; March revenue 1,000.00 with a 100.00 contract liability, April revenue 100.00 on
  delivery. Cross-slice variants with distinct inputs, kept: IFRS-S13-SWITCH-SHIPPING (different lines and events)
  (ADJUDICATION.md R-DUP-02).
