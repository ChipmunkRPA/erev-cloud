# Authored by lane SECFIX-CLO for item ENG-USAGE-FIXED-SCHEDULE-1 (supervisor ruling R-116 (a); candidate AD-61 for the
# independent accountant). Every expected value is derived by hand from the contract's terms, as the notes below
# show; none is read from the engine.
schema: "erev-answer-key/1"
id: "REC-USAGE-STAND-READY-FEE-SCHEDULED-TO-TERM-END"
title: "Usage obligation with a fixed stand-ready fee: the fee is scheduled by time to the term end, beyond the open periods"
status: "active"
families: ["REC", "DISC", "POS"]
tags: ["usage"]
summary: >-
  Northstead gives a freight carrier access to its routing API for three years, 1 January 2026 to 31 December 2028,
  for a fixed fee of 300,000.00 — 200,000.00 paid at signing on 31 December 2025 for the first two years,
  100,000.00 due on 1 January 2028 — plus 0.05 for every call, reported, invoiced and paid at each quarter end. The
  obligation is measured by usage: the calls of a quarter are revenue of that quarter (606-10-32-40), and the fixed
  fee is the consideration for standing ready, recognised as time elapses, 8,333.33 or 8,333.34 a month under
  MONTHLY_EVEN. Only December 2025 to September 2026 are open; every later period is future. The unrecognised part
  of the fixed fee depends on no event: it is scheduled, month by month to December 2028, and nothing of it awaits a
  trigger. At signing the remaining performance obligation of 300,000.00 falls 100,000.00 into each time band, and
  of the contract liability of 200,000.00 the 100,000.00 to be earned in 2026 is current; at 30 September 2026,
  after 63,750.00 of usage fees, the remainder of 225,000.00 falls 100,000.00, 100,000.00 and 25,000.00, and of the
  contract liability of 125,000.00 the 100,000.00 to be earned by 30 September 2027 is current. Usage of later
  quarters is in no figure before it is reported.
notes:
  - >-
    Candidate for the independent accountant (AD-61; supervisor ruling R-116 (a) of 2026-09-30, item
    ENG-USAGE-FIXED-SCHEDULE-1): not an approved key. The ruling: the unrecognised part of a fixed fee that a usage
    obligation recognises by time elapsed is scheduled, not awaiting a trigger. If the accountant answers that it
    awaits a trigger, the expected values of scheduled_amount and awaiting_trigger_amount change places, the
    schedule ends with September 2026, the bands read 75,000.00 / 0.00 / 225,000.00 at signing and 0.00 / 0.00 /
    225,000.00 at 30 September, and the current part of the liability reads 0.00 at both dates.
  - >-
    Derivation of the fixed fee (R-116 (a); POL-090 MONTHLY_EVEN, ALG-11; ALG-01 2.1.3). 36 whole months; the
    cumulative amount at the end of month n is 300,000.00 x n / 36 rounded half up to the cent, and a month's amount
    is the difference of two cumulative amounts: 8,333.33, 16,666.67, 25,000.00 give 8,333.33, 8,333.34, 8,333.33,
    and so in every quarter. Cumulative: 75,000.00 at September 2026, 100,000.00 at December 2026, 175,000.00 at
    September 2027, 200,000.00 at December 2027, 275,000.00 at September 2028. At signing, the day before the term
    begins, no month has ended.
  - >-
    Derivation of the usage fees (R-116 (a); POL-240 DERIVED, S09-R-19). 360,000, 430,000 and 485,000 calls at 0.05
    are 18,000.00, 21,500.00 and 24,250.00, together 63,750.00; each is revenue of the month its quarter ends in and
    raises the transaction price and the allocation by its amount. September 2026: 8,333.33 + 24,250.00 = 32,583.33.
    At 30 September: price and allocation 363,750.00; revenue 75,000.00 + 63,750.00 = 138,750.00; billed
    200,000.00 + 63,750.00 = 263,750.00; remainder 300,000.00 - 75,000.00 = 225,000.00, all of it the fixed fee.
  - >-
    Derivation of the time bands (R-116 (a); POL-201 [12, 24], S15-R-10). From signing, 31 December 2025, the
    bounds are 31 December 2026 and 31 December 2027: the months of 2026, of 2027 and of 2028, 100,000.00 each.
    From 30 September 2026 the bounds are 30 September 2027 and 30 September 2028: 175,000.00 - 75,000.00 =
    100,000.00, 275,000.00 - 175,000.00 = 100,000.00 and 300,000.00 - 275,000.00 = 25,000.00.
  - >-
    Derivation of the liability and its current part (R-116 (a); POL-124, S10-R-24). The liability is what was
    billed less revenue: 200,000.00 at 31 December 2025, when nothing is earned, and 263,750.00 - 138,750.00 =
    125,000.00 at 30 September 2026. The fixed fee recognised in the twelve months after either date is
    100,000.00, below the liability, so the current part is 100,000.00 at both dates. The current part is stated
    per combination group and entity, so the key asserts it on the trace node of CG-NS-ROUTE-01@NS-US.
  - >-
    No financing adjustment (POL-046 APPLY; ENGINE_SPEC S04-R-10). The payments are 200,000.00 on 31 December
    2025 and 100,000.00 on 1 January 2028, 731 days apart: weighted by amount their date is 243 2/3 days after
    signing, the turn of August to September 2026. The service transfers evenly over the term, whose midpoint is
    2 July 2027. The gap is about 305 days, not more than one year, so the consideration is not adjusted. This is
    the policy's test as the product documents it; it is not what the key is a candidate for.
