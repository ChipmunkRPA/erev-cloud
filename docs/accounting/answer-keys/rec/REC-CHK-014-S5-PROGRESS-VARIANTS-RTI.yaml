title: "Right to invoice: December hours recognised and presented as an unbilled receivable until invoiced"
status: "active"
families: ["REC", "POS"]
summary: "Cleaning services at 25.00 per hour (FASB Example 42 Contract A rate) qualify for the right-to-invoice expedient (606-10-55-18). 120 hours are performed in December 2026: revenue 3,000.00. The invoice is issued on 15 January 2027. The right is unconditional (only invoicing and time remain, 606-10-45-4), so the December debit position is an unbilled receivable of 3,000.00, not a contract asset (ALG-03). The netting reclass reverses on 1 January and the January invoice closes the position. Cross-slice variants with distinct inputs, kept: POS-CHK-014-S5-PROGRESS-VARIANTS-RIGHT-TO-INVOICE (delivery events versus usage reports; different terms) (ADJUDICATION.md R-DUP-02)."
