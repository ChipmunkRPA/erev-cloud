schema: erev-answer-key/1
id: REC-GE-01-EPC-UNINSTALLED-MATERIALS-ZERO-MARGIN
title: "Fixed-price EPC contract on cost-to-cost with uninstalled third-party materials at zero margin"
status: active
families: [REC, MOD, POS]
tags: [construction]
summary: "research 05 §6 worked example re-anchored to 2026-2028. Fixed price 12,000,000.00; initial EAC 9,600,000.00 including 1,200,000.00 of HVAC units bought from a third party and delivered to site in June 2026. The customer controls the units on delivery, they are significant and the contractor does not design or manufacture them, so they earn revenue equal to cost and are excluded from the progress ratio (606-10-55-21(b); POL-091). Progress = other costs to date ÷ (EAC − uninstalled materials); revenue = progress × (TP − 1,200,000.00) + 1,200,000.00. Year 2: approved change order +600,000.00 price and +400,000.00 cost, not distinct (25-13(b)), plus a 200,000.00 overrun, other-cost EAC 9,000,000.00. Year 3 completes with other costs of 9,050,000.00. Progress billings 4,800,000.00 / 4,500,000.00 / 3,300,000.00 (gross of retainage). Revenue 5,057,142.86 / 4,122,857.14 / 3,420,000.00; year-end presentation contract asset 257,142.86, contract liability 120,000.00, then 0.00. The engine posts zero-margin revenue only; the materials cost stays in the ERP (POLICIES OQ-15). All year events are dated at year end so each year posts in its December period."
