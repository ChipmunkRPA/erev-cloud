summary: "Bracken Robotik GmbH builds customer-specific end-of-arm tooling for EUR 400,000.00 (inception 1 February 2026). The tooling has no alternative use and the contract gives an enforceable right to payment for performance to date (606-10-25-27(c)), so revenue is recognised over time on cost-to-cost; EAC 300,000.00. Costs: 30,000.00 in February, 60,000.00 in March, 60,000.00 in April. On 30 April an approved change order adds cooling channels for 60,000.00 and 40,000.00 of cost; the work is not distinct from the tooling, so the modification is part of the existing contract (606-10-25-13(b)): allocation 460,000.00, progress 150,000 ÷ 340,000, cumulative revenue 202,941.18, catch-up +2,941.18 (ALG-04 step 6). May costs 100,000.00; June costs 90,000.00 complete the work. Milestone invoices 200,000.00 (31 March) and 260,000.00 (30 June). Revenue ahead of the milestone invoices is conditional: contract asset."
