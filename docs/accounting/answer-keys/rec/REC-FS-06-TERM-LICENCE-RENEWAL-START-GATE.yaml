schema: erev-answer-key/1
id: REC-FS-06-TERM-LICENCE-RENEWAL-START-GATE
title: "Term-licence renewal signed early: licence revenue gated to the renewal start date"
status: active
families: [REC, POB, POS]
tags: []
summary: "A 2026 term licence (60,000.00, functional IP) with 2026 PCS (20,000.00) is invoiced and made available on 1 January 2026. On 15 November 2026 the customer signs and is invoiced for a 2027 renewal: term licence 55,000.00 and PCS 20,000.00, priced at SSP, so a separate contract. The customer already holds the software, but revenue for a renewal of a licence cannot begin before the renewal period starts (606-10-55-58C; POL-025 RENEWAL_PERIOD_START): the renewal licence posts 55,000.00 in January 2027, and the renewal invoice sits in contract liability until then. The renewal contract names the original through renewal_of (REQ-MOD-017; ADJUDICATION.md R-SCH-06)."
