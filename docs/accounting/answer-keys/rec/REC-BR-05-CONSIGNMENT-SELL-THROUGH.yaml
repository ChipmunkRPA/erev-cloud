schema: erev-answer-key/1
id: REC-BR-05-CONSIGNMENT-SELL-THROUGH
title: "Consignment stock at customer plants: revenue on consumption, unbilled receivable before the monthly invoice"
status: active
families: [REC, POS]
tags: []
summary: "Bracken Robotics KK consigns 200 gripper modules (JPY 150,000 each, JPY 30,000,000) to a customer's plants on 1 February 2026. Bracken controls the stock until the customer draws a module into production and can relocate unused stock; the customer has no obligation to pay for modules not consumed (606-10-55-80). Revenue is recognised on each consumption report: 60, 90 and 50 modules at the end of February, March and April. Consumption is invoiced on the 10th of the following month; the right to payment for consumed modules is unconditional, so uninvoiced consumption is an unbilled receivable. JPY has no minor unit (ISO 4217 exponent 0)."
