schema: erev-answer-key/1
id: REC-RB-03-DRG-IN-HOUSE-PATIENT-MONTH-END
title: "Inpatient DRG case spanning month end: revenue by days of care, contract asset before discharge billing"
status: active
families: [REC, POS, JE]
tags: []
summary: "research 05 §12 worked example. A Medicare inpatient admitted on 29 March 2026 is assigned a DRG that pays a fixed 15,000.00 for an expected five-day stay. The stay is a performance obligation satisfied over time as the patient receives care (606-10-25-27(a)); progress is days of care over the expected length of stay: 3 of 5 days by 31 March (60%, 9,000.00) and complete on discharge on 3 April (6,000.00). The claim can be submitted only after discharge, so the March revenue is conditional and presented as a contract asset; the claim of 5 April posts the receivable (JET-03, ENGINE mode). Research 05 §12 pitfall 3: no accrual for in-house patients at period end."
