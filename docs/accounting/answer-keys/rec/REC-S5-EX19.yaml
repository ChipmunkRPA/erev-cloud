id: "REC-S5-EX19"
title: "Uninstalled materials recognised at zero margin and excluded from progress (FASB Example 19)"
status: "active"
families: ["REC", "POS"]
summary: "A 5,000,000.00 refurbishment includes elevators costing 1,500,000.00 that the customer controls in December before installation. The elevators meet 606-10-55-21(b), so their cost is excluded from the progress measure and revenue equal to their cost is recognised (zero margin). Other costs to 31 December are 500,000.00 of 2,500,000.00 (20%), so revenue is 20% x 3,500,000.00 + 1,500,000.00 = 2,200,000.00. Nothing has been billed, so the position is a contract asset of 2,200,000.00. Cost of revenue stays in the ERP (POLICIES OQ-15)."
