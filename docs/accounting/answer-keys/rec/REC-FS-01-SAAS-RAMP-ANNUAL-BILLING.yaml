schema: erev-answer-key/1
id: REC-FS-01-SAAS-RAMP-ANNUAL-BILLING
title: "Three-year SaaS ramp billed annually: straight-line revenue, contract asset in the ramp years"
status: active
families: [REC, POS]
tags: [subscription]
summary: "Fernhill Software books a 36-month enterprise subscription (1 Jan 2026 to 31 Dec 2028) with ramped annual fees of 100,000.00, 150,000.00 and 200,000.00, each invoiced on 1 January under a noncancellable agreement. The service is the same in every year, so the ramp does not reflect a different service level and the 450,000.00 transaction price is recognised on time elapsed (MONTHLY_EVEN, 12,500.00 a month; judgement per research 05 §2 pitfall 2). Revenue runs ahead of billing in the ramp years; the right to the next annual invoice depends on continuing to provide the service, so the debit position is a conditional right presented as a contract asset, not an unbilled receivable (ALG-03; closes M-RA-07 for this pattern)."
