schema: erev-answer-key/1
id: REC-FS-08-TM-RIGHT-TO-INVOICE
title: "Time-and-materials services under the right-to-invoice expedient: unbilled receivable at month end"
status: active
families: [REC, POS]
tags: []
summary: "research 05 §21 worked example. A time-and-materials statement of work bills 200.00 per hour with no cap, minimum or upfront fee, so the invoice corresponds directly to the value transferred (606-10-55-18; POL-092 guard passes). 180 hours are performed in each of January, February and March 2026 and invoiced on the 5th of the following month. Revenue is 36,000.00 a month as performed; the right to invoice is unconditional, so the uninvoiced month is presented as an unbilled receivable (ALG-03 table 2.4-A), not a contract asset."
