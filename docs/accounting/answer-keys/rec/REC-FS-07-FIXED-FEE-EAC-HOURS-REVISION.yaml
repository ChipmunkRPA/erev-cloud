summary: "research 05 §21 worked example. Fixed-fee implementation for 120,000.00 measured on labour hours; EAC 600 hours at inception, revised to 650 hours in month 2 (estimate version 2). Cumulative hours 150, 450 and 650 give revenue 30,000.00, 53,076.92 and 36,923.08; the month-2 amount includes a catch-up of −2,307.69 on month-1 hours because their progress falls from 25.00% to 23.08%. The customer is invoiced 60,000.00 at design sign-off (28 February) and 60,000.00 at go-live (31 March). Revenue ahead of milestone billing is conditional on further performance, so it is a contract asset (30,000.00 at 31 January; 23,076.92 at 28 February), never an unbilled receivable."
