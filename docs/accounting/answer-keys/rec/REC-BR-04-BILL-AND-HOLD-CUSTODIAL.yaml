schema: erev-answer-key/1
id: REC-BR-04-BILL-AND-HOLD-CUSTODIAL
title: "Bill-and-hold robots with a custodial service POB recognised over the holding period"
status: active
families: [REC, ALC, POB]
tags: []
summary: "A customer orders 10 palletising robots for 500,000.00 on 10 January 2026 and asks Bracken to hold them until its new plant opens. On 31 March the robots are complete, tagged and segregated as the customer's, ready for shipment and cannot be redirected, and the customer has requested the arrangement: the four criteria of 606-10-55-83 are met and recorded, control transfers and the robots are invoiced. Bracken will store the robots for an expected six months (April to September); the custodial service is a separate POB (606-10-55-84; POL-094) with SSP 12,000.00 and no stated price. Allocation over SSPs 520,000.00 and 12,000.00: robots 488,721.80, custody 11,278.20 (the remaining cent goes to custody by larger fractional remainder), recognised 1,879.70 a month."
