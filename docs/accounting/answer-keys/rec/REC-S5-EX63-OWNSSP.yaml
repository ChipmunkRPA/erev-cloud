title: "Bill-and-hold spare parts with a custodial services POB recognised over three years (FASB Example 63)"
status: "active"
families: ["REC", "ALC"]
summary: "A machine and spare parts are paid for on 31 December 2026; the machine is taken and the spare parts are segregated, titled to the customer, ready and unusable by the entity, so control transfers (606-10-55-83) and a custodial POB arises (55-84). SSPs 900,000 / 100,000 / 30,000 against 1,000,000.00 give 873,786.41 / 97,087.38 / 29,126.21. Revenue on 31 December 2026: 970,873.79. Custody is recognised by whole months over 2027 to 2029 with cumulative rounding of the exact allocation (D-11a): cumulative 9,708.74 after 2027, 19,417.48 after 2028 and 29,126.21 after 2029, so the annual amounts are 9,708.74 / 9,708.74 / 9,708.73. POLICIES CHK-006 lists 9,708.74 / 9,708.73 / 9,708.74, which is round(posted allocation x progress); see the coverage file. Cross-slice variants with distinct inputs, kept: RND-CHK-006-S5-EX63-OWNSSP-CUSTODY (custody periods 2027 to 2029 versus 2026 to 2028) (ADJUDICATION.md R-DUP-02)."
