schema: erev-answer-key/1
id: REC-RB-05-CAPITATION-PMPM-RATE-AMENDMENT
title: "Capitation per member per month: stand-ready series, variable membership allocated to each month, prospective rate amendment"
status: active
families: [REC, MOD, VC, JE]
tags: []
summary: "Riverbend's primary-care network is paid a capitation of 50.00 per member per month for 2026. Coverage is a stand-ready series of monthly increments; the fee for each month depends only on that month's eligible members at a constant rate, so the variable consideration is allocated entirely to the month it relates to (606-10-32-39(b), 32-40). Membership: January 10,000, February 10,200, March 9,900; revenue 500,000.00, 510,000.00, 495,000.00, billed monthly (ENGINE mode). On 1 July the payor amends the rate to 55.00 for the remaining months; the remaining increments are distinct, so the amendment is prospective (606-10-25-13(a)) and July's 10,100 members give 555,500.00."
