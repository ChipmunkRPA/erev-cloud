schema: erev-answer-key/1
id: ROY-JS-07-ADVERTISING-FUND-GROSS
title: "Advertising fund contributions presented gross as principal revenue under the royalty exception"
status: active
families: [ROY, POB, REC]
tags: []
summary: "Store 101's franchise agreement requires advertising fund contributions of 2% of franchisee sales. The fund's activities are promises within the franchise licence that Juniper Street directs and pays for (it controls the specified services before they are provided), so Juniper Street is principal and presents contributions gross (606-10-55-36 to 55-39; research 05 §13 pitfall 4). Contributions are sales-based consideration for a symbolic licence and are recognised as the sales occur (606-10-55-65): quarterly statements report sales of 300,000.00, contributions 6,000.00, invoiced at the statement date. 2026 fund revenue 24,000.00; fund spending is expense in the ERP; no supplier-clearing line exists."
