schema: erev-answer-key/1
id: ROY-JS-08-ROYALTIES-LAGGING-REPORTS
title: "Franchise royalties accrued from occurred sales before lagging reports arrive, trued up on the statement"
status: active
families: [ROY, VC, POS, LATE]
tags: []
summary: "Royalties of 6% of franchisee sales on a symbolic franchise licence. Franchisee sales reports arrive about 20 days after quarter end, so at each quarter end Juniper Street accrues an estimate of royalties on sales that have occurred (POL-056 ACCRUE_ESTIMATE; 606-10-55-65 permits no forecast of future sales). Q1 2026 accrual 17,400.00 (POS sell-through data indicate sales of 290,000.00); the statement of 20 April reports 305,000.00 (18,300.00) and the difference of +900.00 posts in April (JET-04a). Q2 accrual 18,000.00; the statement of 20 July reports 295,000.00 (17,700.00): true-up −300.00 in July. Royalties on occurred sales are unconditional rights, so the accrual is presented as an unbilled receivable until the statement is invoiced."
