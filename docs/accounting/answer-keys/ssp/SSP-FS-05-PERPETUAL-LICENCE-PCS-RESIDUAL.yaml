summary: "research 05 §3 worked example. Signed and made available on 31 March 2026: perpetual licence, 12 months of PCS (April 2026 to March 2027) and training delivered in May 2026, invoiced 370,000.00 on 31 March. PCS (54,000.00, observable renewals) and training (12,000.00) have observable SSPs; licence prices are highly variable, so the residual approach applies (606-10-32-34(c)): licence SSP = 370,000.00 − 66,000.00 = 304,000.00. Allocation equals the SSPs. The licence is recognised at transfer, PCS on time elapsed (4,500.00 a month), training on delivery. A PCS renewal for April 2027 to March 2028 at 60,000.00, signed 15 February 2027 and invoiced 15 March 2027, is a separate contract: nothing is recognised at signing; 5,000.00 a month from April 2027."
