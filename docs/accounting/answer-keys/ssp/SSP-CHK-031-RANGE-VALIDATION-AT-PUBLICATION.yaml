summary: "The SSP book holds two versions of the licence range, each with the statistics of its attached population of standalone transactions (world.ssp_books entry `population`, dev-guide DG-AK-45). The first version (midpoint 160.00, range ±15%: 136.00 to 184.00) has 23 of 40 transactions inside: half-width 0.15 and coverage 0.575 pass POL-073 (0.20 and more than 0.50), so no finding. The second version (±25%: 120.00 to 200.00) has 20 of 40 inside: half-width 0.25 raises RANGE_TOO_WIDE and coverage 0.50, which is not greater than 0.50, raises COVERAGE_TOO_LOW, both WARNING under mode WARN (POLICIES §3.3; CHK-031). A licence booked on 1 February 2026 at 150.00 resolves its SSP from the first version, inside the range at the contract price (POL-071 CONTRACT_PRICE)."
