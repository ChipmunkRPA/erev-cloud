schema: erev-answer-key/1
id: RET-BR-03-PRICE-PROTECTION-STOCK-ROTATION
title: "Distributor price protection and stock-rotation returns: refund liability and return asset"
status: active
families: [RET, VC, POS]
tags: []
summary: "Bracken Robotik GmbH sells to a distributor on 1 March 2026 (EUR). Contract BR-03-ARMS: 1,000 robot arms at 200.00 (200,000.00) with price protection: when the list price falls, the distributor is credited the reduction on units still in its stock. Estimate version 1: no reduction planned (0.00). On 15 May the list price falls by 20.00 with 600 units in distributor stock: version 2 constrains 12,000.00; revenue falls to 188,000.00 (JET-04a) and a refund liability of 12,000.00 is recognised (JET-04b) until the credit memo of 10 June. Contract BR-03-SPARES: 500 spare kits at 80.00 (40,000.00) with a stock-rotation right to return slow-moving kits for credit until 31 August; expected returns 25 kits, carrying cost 50.00 and recovery cost 2.00 per kit (ALG-06). At transfer: revenue 38,000.00, refund liability 2,000.00, return asset 1,200.00 (JET-07c against COST_OF_REVENUE). 20 kits are returned and credited on 20 June: refund liability 400.00; JET-07d derecognises 960.00 into inventory clearing. At window expiry: revenue +400.00, refund liability 0.00, return asset 0.00. Refund liabilities and return assets are never netted into the contract position (POL-127)."
