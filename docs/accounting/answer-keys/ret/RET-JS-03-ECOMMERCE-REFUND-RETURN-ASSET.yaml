schema: erev-answer-key/1
id: RET-JS-03-ECOMMERCE-REFUND-RETURN-ASSET
title: "E-commerce espresso machines with a 30-day return right: refund liability, return asset and re-estimate"
status: active
families: [RET, REC, POS]
tags: [portfolio]
summary: "The March 2026 e-commerce cohort ships 400 espresso machines at 250.00 (100,000.00), paid at order, with a 30-day return right ending 30 April. Expected returns 20 machines (5%); carrying cost 150.00 and recovery cost 10.00 per machine (ALG-06): revenue 95,000.00, refund liability 5,000.00, return asset 2,800.00 at 31 March. On 15 April early return data reduce the estimate to 18 (JET-04a +500.00; refund liability 4,500.00; return asset 2,520.00). Returns: 12 machines on 20 April and 4 on 28 April, refunded by credit memo; each return reduces E and derecognises the return asset into inventory clearing (JET-07d: 1,680.00 and 560.00). At window expiry E = 0: revenue 96,000.00, refund liability 0.00, return asset 0.00 (JET-07c releases 280.00 to cost of revenue)."
