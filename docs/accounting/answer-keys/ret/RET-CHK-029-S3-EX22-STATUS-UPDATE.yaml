schema: "erev-answer-key/1"
id: "RET-CHK-029-S3-EX22-STATUS-UPDATE"
title: "Right of return with a partial cancellable invoice and its S10-R-07 status update: the update adds no billing to the refund-liability base"
status: "active"
families: ["RET", "VC", "JE"]
summary: "RET-CHK-029 derivative (D-91 C606-01). 100 products at 100.00 (cost 60.00) transfer on 10 January 2026 with a return window ending 15 March; 20 returns are expected (rate 0.20), recovery costs immaterial. Only 1,000.00 of the 10,000.00 is invoiced on 10 January, as a cancellable line INV-1 / INV-1-1; on 20 January the ERP re-sends the same line with is_cancellable false and the same amount, an S10-R-07 status update that adds no billing anywhere in the engine. ALG-06 step 2: revenue round(100 x (100 - 0 - 20)) = 8,000.00, transaction price 8,000.00, expected returns -2,000.00. Step 3 (S09-R-23a): units billed U_b = 1,000 / 100 = 10 with or without the update, E_b = min(20, 10 - 0) = 10, refund liability 1,000.00 (JET-04b); ALG-02: the net position billed 1,000 - revenue 8,000 - RL 1,000 = -8,000.00 is a debit, so JET-06 presents a contract asset of 8,000.00 (P01 lines at role_account grain: contract liability dr 1,000.00 = JET-02 8,000 + JET-04b 1,000 - JET-06 8,000; contract asset dr 8,000.00); step 4: return asset 60 x 20 = 1,200.00 against cost of revenue (JET-07c). In February two units come back and are refunded (credit memo 200.00): E 18, U_b stays 10 (credit memos never enter the base; returned units leave through Y), E_b = min(18, 10 - 2) = 8, refund liability 800.00 (P02 movement -200.00), billed_cum 800.00, 120.00 of the return asset is derecognised (JET-07d), revenue unchanged at 8,000.00, contract asset 8,000.00. The window ends on 15 March: expected returns 0, transaction price and revenue 9,800.00 (JET-04a 1,800.00 = 9,800.00 - 8,000.00), refund liability and return asset nil (JET-07c 1,080.00), contract asset 9,000.00 (P03 at role_account grain: the contract liability nets to nil, JET-04a dr 1,800 less the JET-04b release cr 800 and the JET-06 movement cr 1,000; contract asset dr 1,000.00). POL-004 ERP (explicit): every line counts on its effective date. On main before D-91 the update was counted as a second line (E_b 20, refund liability 2,000.00, contract asset 9,000.00 in January)."
