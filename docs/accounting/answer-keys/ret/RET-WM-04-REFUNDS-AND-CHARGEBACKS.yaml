schema: erev-answer-key/1
id: RET-WM-04-REFUNDS-AND-CHARGEBACKS
title: "Refunds and chargebacks on first-party orders estimated as refund liabilities and re-estimated"
status: active
families: [RET, VC, POS]
tags: [portfolio]
summary: "January 2026 first-party orders of perishable goods: 500,000.00 paid at checkout and delivered in January; goods are not returned. Wayfarer refunds customers for late or damaged deliveries and absorbs card chargebacks, so part of the consideration is expected to be refunded: variable consideration reducing revenue with a refund liability for the consideration received (606-10-32-10, 55-22). Estimate version 1 (31 January): 4% = 20,000.00; version 2 (28 February): 3.5% = 17,500.00 (revenue +2,500.00); final version 3 (31 March, dispute window closed): 18,200.00. Credit memos: refunds 12,000.00 in February and chargebacks 6,200.00 in March. Revenue 480,000.00 / 482,500.00 / 481,800.00; refund liability 20,000.00 / 5,500.00 / 0.00. The refund liability is never netted into the contract position (POL-127)."
