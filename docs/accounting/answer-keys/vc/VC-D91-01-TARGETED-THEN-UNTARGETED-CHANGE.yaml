# Authored by engine lane ENG-B2 from POLICIES §2.1.2 and ENGINE_SPEC S08-R-07 (rev 1.6), decision D-91; never from engine output.
schema: "erev-answer-key/1"
id: "VC-D91-01-TARGETED-THEN-UNTARGETED-CHANGE"
title: "Targeted variable consideration survives later untargeted price changes: the carried quota is spread by inception SSP and posted as one apportionment (D-91 S08-R-07)"
status: "active"
families: ["VC", "ALC", "DISC"]
tags: ["targeted-vc", "estimate-change"]
summary: "Two point-in-time products A and B with standalone selling prices of 100.00 each are sold for 50.00 each on 1 January 2026. A variable consideration element of 100.00 is allocated entirely to A under 606-10-32-40 (attested criteria, POL-044), so the inception allocation is A 150.00 / B 50.00; A transfers on 10 January (revenue 150.00). A contract-wide variable element then moves 0 -> 100.00 (1 February) -> 0 (1 March) -> 100.00 (1 April). Under 606-10-32-43 the later changes are allocated on the same basis as at inception without undoing the 32-40 allocation: each change is spread by relative SSP (50/50) over the carried quotas, x_A = 150 + U/2 and x_B = 50 + U/2, and the posted allocations are one apportionment of the price over those exact quotas. February: A 200.00 / B 100.00, revenue +50.00 on the satisfied A; March: A 150.00 / B 50.00, revenue -50.00; April: A 200.00 / B 100.00, revenue +50.00. B is wholly unsatisfied and carries no targeted quota, so the RPO under POL-200 APPLY is B's allocation: 50.00, 100.00, 50.00, 100.00. Before D-91 the engine re-derived every quota from raw SSP (150/150, 100/100, 150/150) and posted no February catch-up."
