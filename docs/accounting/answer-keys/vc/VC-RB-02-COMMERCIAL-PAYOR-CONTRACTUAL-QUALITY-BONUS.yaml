schema: erev-answer-key/1
id: VC-RB-02-COMMERCIAL-PAYOR-CONTRACTUAL-QUALITY-BONUS
title: "Commercial payor: contracted rates as the transaction price and a value-based quality bonus under the constraint"
status: active
families: [VC, POS, JE]
tags: []
summary: "April 2026 outpatient procedures for members of a commercial health plan: gross charges 500,000.00; the payor contract pays 45% of charges, so the contractual adjustment of 275,000.00 is an explicit price concession and the fixed consideration is the contracted 225,000.00, billed on 30 April (JET-03, ENGINE mode). The contract adds a quality bonus of 2% of 2026 contracted amounts if quality targets are met. Estimate version 1: most likely 4,500.00, constrained to 0.00 because the measures are outside Riverbend's influence until year-end data are available (606-10-32-12). Version 2 at the 30 September review: targets met on audited data, constrained 4,500.00; revenue +4,500.00 on satisfied visits (JET-04a). The bonus is invoiced on 31 January 2027; until then it is conditional on the annual measurement and is presented as a contract asset."
