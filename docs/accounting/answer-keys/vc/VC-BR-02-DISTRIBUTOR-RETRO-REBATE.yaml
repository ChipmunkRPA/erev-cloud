schema: erev-answer-key/1
id: VC-BR-02-DISTRIBUTOR-RETRO-REBATE
title: "Distributor retrospective volume rebate re-estimated quarterly with a refund liability"
status: active
families: [VC, RET, POS]
tags: []
summary: "research 05 §8 worked example, adapted so that the threshold measures the distributor's annual sell-through: a noncancellable blanket order for 20,000 servo packs at 50.00 (1,000,000.00) ships 6,000 / 7,000 / 5,000 / 2,000 units in the four quarters of 2026, invoiced gross on shipment. The retrospective rebate on all 2026 purchases is 3% if sell-through exceeds 10,000 units and 5% if it exceeds 18,000 units (most likely amount; the constraint favours the higher rebate when evidence is weak). Estimate versions: 1 January forecast 16,000 (3%, 30,000.00); 30 June forecast 19,000 (5%, 50,000.00); 31 December actual 18,000 (3%, 30,000.00). The rebate is price-reducing VC allocated to the POB; revenue = unit allocation × units shipped with cumulative catch-up (JET-02, JET-04a) and the rebate on billed consideration is a refund liability (JET-04b), settled by the credit memo of 31 January 2027. Quarterly revenue 291,000.00 / 326,500.00 / 237,500.00 / 115,000.00; refund liability 9,000.00 / 32,500.00 / 45,000.00 / 30,000.00."
