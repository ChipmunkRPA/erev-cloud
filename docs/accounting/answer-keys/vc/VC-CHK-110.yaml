summary: "A calendar-year stand-ready API service with a 120,000.00 minimum billed 30,000.00 a quarter in advance; usage fees are 0.10 per call for the first 1,000,000 calls and 0.08 above, on annual cumulative usage. Because the fee for a period depends on usage in other periods, 32-40(b) fails and POL-240 derives ESTIMATE_MEASUREMENT_PERIOD_TP: the transaction price is the minimum plus the constrained expected overage, recognised by whole months. Inception: 1,500,000 calls, fees 140,000.00: Q1 revenue 35,000.00; billed 30,000.00, contract asset 5,000.00. End of Q2: 1,200,000 calls, fees 116,000.00, so the price falls to the 120,000.00 minimum: cumulative 60,000.00 and Q2 revenue 25,000.00 (including a -5,000.00 catch-up on Q1 progress). Q3 and Q4 30,000.00 each; actual usage 1,100,000 calls confirms no overage."
