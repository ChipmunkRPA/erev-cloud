schema: erev-answer-key/1
id: VC-CAP-USAGE-QUARTERLY-MINIMUM-TRUEUP
title: "API usage with a non-cumulative quarterly minimum: measurement-period estimate, shortfall invoice and true-up"
status: active
families: [VC, REC, POS]
tags: [usage]
summary: "Capability key for the usage-and-minimum-commitment family (research 05 CAP-13; POLICIES PT-01), Fernhill Software. API calls are billed monthly in arrears at 0.10 per call with a minimum of 30,000.00 per calendar quarter; a quarter's shortfall is invoiced at quarter end and the minimum does not carry over. Because the minimum makes the monthly fee depend on usage in other months of the quarter, usage is not allocated to the month it occurs (POL-240 ESTIMATE_MEASUREMENT_PERIOD_TP), but each quarter's consideration relates only to that quarter, so each quarter is its own measurement period: one stand-ready POB per quarter with its minimum as fixed consideration and usage above the minimum as VC targeted to that quarter (32-40). Q1: expected usage 270,000 calls (27,000.00), no VC; revenue 10,000.00 a month; actual 240,000 calls (8,000.00 / 9,000.00 / 7,000.00) and a shortfall invoice of 6,000.00. Q2: version 2 expects 360,000 calls (VC 6,000.00, 12,000.00 a month); actual 400,000 calls (13,000.00 / 14,000.00 / 13,000.00); version 3 at 30 June true-ups VC to 10,000.00 and June revenue to 16,000.00. Revenue ahead of the usage and shortfall invoices is a contract asset."
