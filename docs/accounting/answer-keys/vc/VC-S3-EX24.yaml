title: "Retrospective volume rebate: cumulative catch-up and refund liability when the threshold becomes expected (FASB Example 24)"
status: "active"
families: ["VC", "RET", "POS"]
summary: "Product A sells at 100.00 a unit; if the customer buys more than 1,000 units in 2026 the price for all units becomes 90.00. The key books the 575 units ordered in the first half as one contract (assumption, so the rebate relates only to those units). Q1: 75 units, threshold not expected: revenue 7,500.00. Q2: 500 units and a customer acquisition make the threshold expected (version 2, 5,750.00). The unit allocation falls to 90.00: cumulative revenue 51,750.00, so Q2 revenue is 45,000.00 for the new units less a 750.00 catch-up on the Q1 units = 44,250.00. Invoices continue at 100.00, so a refund liability of 5,750.00 is recognised (JET-04b; 606-10-32-10, Example 40 presentation) and the contract position is nil. Cross-slice variants with distinct inputs, kept: JE-CHK-025-S3-EX24-VOLUME-REBATE-REFUND-LIABILITY (VOLUME_TIER versus REBATE element; different dates and invoices) (ADJUDICATION.md R-DUP-02)."
