summary: "research 05 §7 worked example in whole dollars. Federal development programme, one integrated POB on cost-to-cost: target cost 10,000,000.00, target fee 800,000.00, 80/20 government/contractor share, fee floor 400,000.00 and ceiling 1,200,000.00: fee = 800,000.00 − 20% × (EAC − 10,000,000.00). Consideration = allowable costs + fee, so the transaction price is target cost + target fee (stated price 10,800,000.00) plus variable consideration of 80% × (EAC − target cost). EAC 10,500,000.00 in Year 1 (fee 700,000.00, TP 11,200,000.00) and 11,000,000.00 from Year 2 (fee 600,000.00, TP 11,600,000.00). Cumulative costs 3,150,000.00 / 7,700,000.00 / 11,000,000.00 give revenue 3,360,000.00 / 4,760,000.00 / 3,480,000.00. Provisional billing at cost plus 8%; the final fee adjustment is credited at completion."
