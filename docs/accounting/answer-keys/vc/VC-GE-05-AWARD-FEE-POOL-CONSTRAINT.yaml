schema: erev-answer-key/1
id: VC-GE-05-AWARD-FEE-POOL-CONSTRAINT
title: "Cost-plus-award-fee contract: award fee pool constrained on award history and trued up at each evaluation"
status: active
families: [VC, REC, POS]
tags: []
summary: "A 2026 cost-plus-award-fee services contract: estimated allowable costs 4,000,000.00 plus a base fee of 120,000.00 (stated consideration 4,120,000.00), cost-to-cost progress; an award fee pool of 500,000.00 per half-year is determined by the customer's evaluation board. Estimate version 1 (inception): expected value 700,000.00 but constrained to 0.00 because the programme has no award history and the outcome depends on the board's judgement (606-10-32-12(a), (d)). Version 2 (30 June): period 1 award 400,000.00 determined; period 2 expected 350,000.00, constrained 250,000.00; constrained total 650,000.00. Version 3 (31 December): period 2 award 420,000.00; total 820,000.00. Costs 1,000,000.00 a quarter; billing = costs plus 3% base fee quarterly, award fees invoiced when determined. Revenue ahead of billing is conditional on the award determination (contract asset)."
