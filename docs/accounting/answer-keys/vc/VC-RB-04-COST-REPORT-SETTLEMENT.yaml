summary: "Riverbend bills 1,200,000.00 of 2026 Medicare outpatient services at interim rates (aggregated here at 31 December 2026). Based on the draft cost report, the final settlement is expected to require repayment of 60,000.00, so the transaction price is 1,140,000.00 and the expected repayment on billed consideration is a refund liability (JET-04b; 606-10-32-10). When the cost report is filed on 31 May 2027 the estimate falls to 45,000.00 (revenue +15,000.00, refund liability 45,000.00). The final settlement on 30 November 2027 is 50,000.00: revenue −5,000.00; the settlement credit memo reduces the receivable (JET-03 credit memo, ENGINE mode) and the refund liability is released to 0.00."
