schema: erev-answer-key/1
id: VC-RB-01-SELF-PAY-IMPLICIT-CONCESSION-CREDIT-LOSS
title: "Self-pay emergency visit cohort: implicit price concessions to a receivable contra, later credit loss outside revenue"
status: active
families: [VC, JE, POS, STP1]
tags: [portfolio]
summary: "research 05 §12 worked example. The March 2026 cohort of self-pay emergency visits is billed at gross charges of 2,000,000.00. Riverbend treats patients regardless of ability to pay and expects to collect 20% based on the cohort's collection history, so the transaction price is 400,000.00 net of an implicit price concession (606-10-32-7(b); POL-015 portfolio). Under billing.posting ENGINE the engine posts the receivable (JET-03 Dr ACCOUNTS_RECEIVABLE 2,000,000.00), revenue 400,000.00 (JET-02) and the concession to RECEIVABLE_CONTRA (JET-04c, κ = 0.80: 1,600,000.00; D-14a). On 30 June the collection estimate falls to 18% (κ = 0.82): revenue −40,000.00 (JET-04a) and receivable contra +40,000.00; net receivable 360,000.00. In September a patient's bankruptcy leads to a 5,000.00 write-off: a credit loss measured outside the engine (POL-125; 606-10-55-106 to 55-109), so the engine posts nothing and revenue stays 360,000.00. Cash collection and write-offs are ERP postings."
