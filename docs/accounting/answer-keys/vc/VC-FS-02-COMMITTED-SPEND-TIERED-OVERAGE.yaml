schema: erev-answer-key/1
id: VC-FS-02-COMMITTED-SPEND-TIERED-OVERAGE
title: "Committed-spend drawdown with annual tiered overage estimated for the measurement period"
status: active
families: [VC, REC, POS, DISC]
tags: [usage]
summary: "Annual API platform agreement for calendar 2026: a committed spend of 200,000.00 invoiced on 1 January covers the first 4,000,000 calls; calls above the commitment are rated on annual cumulative usage at 0.04 per call up to 6,000,000 calls and 0.03 above, invoiced in arrears. Because the overage rate depends on usage in other quarters, the usage cannot be allocated to the period in which it occurs (32-40(b) fails; POL-240 ESTIMATE_MEASUREMENT_PERIOD_TP, POLICIES PT-01). The stand-ready series POB recognises the constrained transaction price on time elapsed. Estimate version 1 (expected value 40,000.00, constrained 20,000.00), version 2 at 30 June (expected value 95,000.00, constrained 80,000.00) and version 3 at 31 December (actual 6,500,000 calls, 95,000.00) each trigger a cumulative catch-up (ALG-10). Revenue ahead of the overage invoices is a conditional right (contract asset). The June catch-up splits into 25,000.00 of revenue from prior-period performance (ALG-10 §2.11.3) and current-period progress. The overage element carries an explicit direction INCREASE (T-CON-12; supervisor-ruled input clarification of 2026-09-19, ENC-VC-direction): additional consideration above the commitment, never a refund candidate."
