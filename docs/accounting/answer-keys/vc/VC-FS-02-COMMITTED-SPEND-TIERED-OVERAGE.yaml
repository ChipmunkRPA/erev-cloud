contracts:
  - external_id: FS-02
    customer: CUST-FS02
    contracting_entity: FS-US
    transaction_currency: USD
    inception_date: "2026-01-01"
    lines:
      - obligation_key: L1-COMMIT
        product_code: API-COMMIT
        quantity: "1"
        total_price: "200000.00"
        start_date: "2026-01-01"
        end_date: "2026-12-31"
    estimates:
      - element_code: VC-FS02-OVERAGE
        estimate_kind: VARIABLE_CONSIDERATION
        method: EXPECTED_VALUE
        obligation_key: L1-COMMIT
        vc_element_type: VOLUME_TIER
        # Supervisor-ruled input correction (2026-09-19, ENC-VC-direction; an input clarification,
        # not an oracle change): the tiered overage is additional consideration the customer pays
        # above the 200,000.00 commitment (606-10-32-5, 32-8), so the element INCREASES the
        # transaction price (T-CON-12 direction, 04 B3-D16). The key's text and every expected
        # figure already describe an increase (TP 220,000.00 / 280,000.00 / 295,000.00; revenue
        # 55,000.00 / 140,000.00 / 233,333.33 / 295,000.00) and are unchanged. Without the member
        # the B3-DG-17 default for VOLUME_TIER (a volume rebate, DECREASE) applied, the overage was
        # measured as a refundable reduction and stage 10 sought a REFUND_LIABILITY account this
        # world does not map (ACCOUNT_MAPPING_MISSING). No refund, rebate, return or cancellation
        # right exists in these facts.
        direction: INCREASE
        allocation_target: OBLIGATIONS
        target_obligation_keys: [L1-COMMIT]
        versions:
          - version_no: "1"
            effective_date: "2026-01-01"
            scenarios:
              - {outcome: "calls=4000000", amount: "0.00", probability: "0.25"}
              - {outcome: "calls=5000000", amount: "40000.00", probability: "0.50"}
              - {outcome: "calls=6000000", amount: "80000.00", probability: "0.25"}
            unconstrained_amount: "40000.00"
            most_conservative_amount: "0.00"
            constrained_amount: "20000.00"
            currency: USD
            rationale: "No usage history for this customer; half of the expected overage is constrained (606-10-32-12(b), (c))."
          - version_no: "2"
            effective_date: "2026-06-30"
            scenarios:
              - {outcome: "calls=6000000", amount: "80000.00", probability: "0.50"}
              - {outcome: "calls=7000000", amount: "110000.00", probability: "0.50"}
            unconstrained_amount: "95000.00"
            most_conservative_amount: "0.00"
            constrained_amount: "80000.00"
            currency: USD
            rationale: "Cumulative calls 2,500,000 at 30 June with a rising monthly run rate; the 7,000,000-call outcome remains uncertain."
          - version_no: "3"
            effective_date: "2026-12-31"
            scenarios: [{outcome: "calls=6500000", amount: "95000.00", probability: "1.00"}]
            unconstrained_amount: "95000.00"
            most_conservative_amount: "95000.00"
            constrained_amount: "95000.00"
            currency: USD
            rationale: "Actual annual usage 6,500,000 calls; uncertainty resolved."
