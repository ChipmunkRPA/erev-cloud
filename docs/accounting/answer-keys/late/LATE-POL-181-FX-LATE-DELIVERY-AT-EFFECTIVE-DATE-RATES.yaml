families: [LATE, FX]
tags: [fx]
summary: >-
  Entity US01 (functional USD), EUR 5,000.00 equipment sale, not yet invoiced, ERP billing; [A] payment depends on
  commissioning, so the right is CONDITIONAL. January 2026 is locked on 2026-02-03 with nothing posted. The delivery
  effective 2026-01-20 is recorded on 2026-02-05. ALG-09 with POL-181: the replay measures the asset layer at the
  January average 1.1100 (USD 5,550.00), and February posts the revenue with origin_period FY2026-P01. January's
  closing remeasurement (1.1200) is not reposted; the cumulative remeasurement to the February closing rate 1.1400
  lands in February: USD 5,700.00 − 5,550.00 = 150.00 gain. JET-06 presents a contract asset of EUR 5,000.00 (USD
  5,700.00) at 28 February.
