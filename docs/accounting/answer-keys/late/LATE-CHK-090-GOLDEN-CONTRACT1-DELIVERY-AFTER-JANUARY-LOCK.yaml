schema: "erev-answer-key/1"
id: LATE-CHK-090-GOLDEN-CONTRACT1-DELIVERY-AFTER-JANUARY-LOCK
title: "Delivery effective in a locked January posts in February with origin_period January"
status: active
families: [LATE, PAR, JE]
tags: []
summary: >-
  Legacy-parity world, entity ME1, ERP billing. Golden Contract 1 is invoiced 100.00 on each of POB #1 to POB #3 on
  2023-01-31 and January 2023 is locked on 2023-02-03 with no revenue. The January deliveries (POB #1 two units, POB
  #2 one unit, POB #3 half) are effective 2023-01-31 but recorded on 2023-02-05, when February is open. The engine
  replays from inception with the events inserted at their effective dates and posts the cumulative difference in
  February with origin_period FY2023-P01 and reason LATE_EVENT: Dr 21001 295.69 / Cr 5001 128.84, Cr 5002 118.53, Cr
  5003 48.32 (CHK-090). The locked January batch stays empty; the position (+4.31) needs no reclass; each late
  delivery raises the LATE_EVENT warning for the out-of-period register.
