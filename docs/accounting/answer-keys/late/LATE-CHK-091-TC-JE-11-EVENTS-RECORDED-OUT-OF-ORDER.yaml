summary: >-
  Legacy-parity world, entity ME2, all periods open. Golden Contract 2 delivers one hardware unit on 2023-01-31
  (58.85, presented as unbilled A/R at January end). Then, as in legacy TC-JE-11, a Software 1 delivery dated
  2023-03-31 is recorded first and a 500.00 invoice on POB #1 dated 2023-02-28 is recorded second. The engine orders
  events by effective date (ENG-06): February reverses the January reclass (Dr 21002 58.85 / Cr 15002 58.85) and the
  position +441.15 needs no reclass; March posts Dr 21002 104.62 / Cr 5002 104.62 and the position +336.53 needs no
  reclass; unbilled receivable is 0.00 at both month ends (CHK-091). The invoice, recorded after a later-dated event,
  raises LATE_EVENT (WARNING). [A] Priced lines carry the UNCONDITIONAL class.
