schema: erev-answer-key/1
id: TAX-WM-08-TAXES-AND-FEES-GROSS-OR-NET
title: "Booking fees with VAT collected from customers excluded from the transaction price under engine billing"
status: active
families: [TAX, JE, POB]
tags: [portfolio]
summary: "Wayfarer Marketplace UK charges travellers a booking fee and collects UK VAT at 20% on it. The tenant elects to exclude taxes collected from customers on behalf of tax authorities (POL-045 EXCLUDE_ALL_IN_SCOPE; 606-10-32-2A), and this key runs with billing.posting ENGINE, so the engine posts the invoice: Dr ACCOUNTS_RECEIVABLE / Cr CONTRACT_LIABILITY for the fee and Cr SALES_TAX_PAYABLE for the VAT (JET-03). Booking fees of GBP 50,000.00 / 55,000.00 / 45,000.00 in the first quarter of 2026 carry VAT of 10,000.00 / 11,000.00 / 9,000.00; the booking service is complete when the booking is confirmed, so revenue equals the net fees (150,000.00). A digital services tax imposed on Wayfarer's own UK revenue is not collected from customers and is not excluded; it is an ERP expense, not an engine posting. BILLING_RECORDED amount is the net fee and tax_amount the VAT."
