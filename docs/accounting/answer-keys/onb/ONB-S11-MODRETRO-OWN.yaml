title: "Modified retrospective adoption: contract recomputed from inception gives the Topic 606 balances at the date of initial application"
status: "active"
families: ["ONB", "REC"]
summary: "A three-year contract signed on 1 January 2025 for a licence and post-contract support for 300,000.00, invoiced and paid at inception. Legacy GAAP recognised 100,000.00 a year. Under Topic 606 the licence is allocated 180,000.00 (point in time, 1 January 2025) and support 120,000.00 by whole months. The tenant onboards the contract by recomputing from inception (POL-210) with a date of initial application of 1 January 2026. At 31 December 2025 the ASC606 measures are cumulative revenue 220,000.00 and contract liability 80,000.00; the 120,000.00 difference from the legacy liability (200,000.00) is the cumulative effect, exported for a manually approved retained-earnings journal (POL-218; RETAINED_EARNINGS is reserved, D-14a). 2026 revenue is 40,000.00 and the liability at 31 December 2026 40,000.00. The LEGACY book comparison belongs to the delta-posting keys."
