title: "Business combination: acquired subscription as if originated in ASC606 and at fair value in IFRS15 (CHK-121)"
status: "active"
families: ["ONB", "IFRS", "REC"]
tags: ["business-combination"]
summary: "A 24-month subscription for 240,000.00 was billed upfront on 1 January 2025 by an acquiree; the entity acquires the business on 1 January 2026. The acquirer books the contract with its original terms (inception 1 January 2025) and establishes the engine opening state at the cutover of 31 December 2025 with OPENING_BALANCE_ESTABLISHED, reason BUSINESS_COMBINATION: revenue to date 120,000.00, billed 240,000.00, remaining allocation 120,000.00. Nothing posts at the cutover (S07-R-05); purchase accounting belongs to the ERP. ASC606 book, as if originated (805-20-30-28, ASU 2021-08; POL-215 FORCED): opening contract liability 120,000.00, then 10,000.00 of revenue a month in 2026. IFRS15 book (IFRS 3.18): the payload fair_value_contract_liability of 90,000.00 is the opening liability and is recognised over the remaining 12 months, 7,500.00 a month (S07-R-08; POLICIES PT-11 CHK-121). The expedient part of CHK-121 (SSPs at the acquisition date, POL-217) is not in this key because POL-216 and POL-217 are acquisition-level elections that erev-answer-key/1 cannot carry (ADJUDICATION.md R-GAP-02)."
