summary: "A 36-month robot-as-a-service arrangement (2026 to 2028) charges 3,000.00 a month (108,000.00). The customer controls the use of an identified robot (lease component, SSP 90,000.00) and receives fleet software and maintenance (Topic 606 service, SSP 30,000.00). The lessor allocates the consideration on relative SSP (842-10-15-38 to 15-42, using 606-10-32-28 to 32-41): lease 81,000.00, service 27,000.00. The lease allocation is out of scope (scope flag LEASE_842, REQ-CON-016): no revenue, schedule or journal line for it, and an entry in the scope exclusion register (POLICIES PT-09; REQ-03 §12 rule 1). The service is recognised 750.00 a month. The service share of the monthly fee is invoiced quarterly in advance (2,250.00); the lease share belongs to the lease system."
