summary: "On 1 July 2026 Products X and Y (equal SSPs) are sold for 1,000.00 fixed plus variable consideration estimated at 200.00: 600.00 each. X transfers immediately. On 30 November Product Z is added for 300.00, not its SSP; Y and Z are distinct: termination and new contract accounting, pool 600.00 + 300.00 = 900.00, allocated 450.00 each. On 31 December the estimate rises to 240.00. The VC was promised before the modification, so the 40.00 is allocated on the inception basis to X and Y (32-45(a)): X's 20.00 is recognised immediately; Y's 20.00 was unsatisfied at the modification and is re-split over the post-modification weights, 10.00 each to Y and Z (POL-106). Y transfers on 31 March 2027 (460.00), Z on 30 June 2027 (460.00); the 1,540.00 invoice closes the contract asset."
