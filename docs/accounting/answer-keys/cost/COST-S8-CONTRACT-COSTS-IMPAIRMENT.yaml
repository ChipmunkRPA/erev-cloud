id: "COST-S8-CONTRACT-COSTS-IMPAIRMENT"
title: "Contract cost asset impaired when remaining consideration less remaining costs falls below carrying amount; no reversal under US GAAP"
status: "active"
families: ["COST", "JE"]
summary: "A 40,000.00 commission is capitalised on a four-year 400,000.00 services contract and amortised by whole months (10,000.00 in 2026). At 31 December 2026 the carrying amount is 30,000.00; remaining consideration is 300,000.00 and remaining direct costs are 285,000.00 (estimate at completion 380,000.00 less 95,000.00 incurred), so the recoverable amount is 15,000.00 and JET-09c posts an impairment of 15,000.00 (340-40-35-3, 35-4). No renewal is anticipated (the RENEWAL_EXPECTATION version carries no expected consideration), so the anticipated-renewal term of JET-09c rev 1.2 is nil. The impaired carrying amount is amortised over the remaining 36 months: 5,000.00 a year, carrying 10,000.00 at the end of 2027 and 5,000.00 at the end of 2028; direct costs of 95,000.00 a year are incurred monthly and the monthly test finds no further shortfall. On 31 December 2028 the estimate at completion rises to 500,000.00: remaining consideration 100,000.00 less remaining costs 215,000.00 gives a negative recoverable amount of −115,000.00, and JET-09c impairs the whole carrying amount, 5,000.00, never more: the carrying amount floors at 0.00 and the excess belongs to the loss test of Subtopic 605-35, not to the asset (ADJUDICATION.md R-COST-01). The ASC606 book never reverses the impairment (340-40-35-6); the IFRS15 reversal (CHK-131) is not in this key. The research 04 example's remaining consideration of 100,000.00 is restated to a 400,000.00 contract with the same 15,000.00 recoverable amount. Cross-slice variants with distinct inputs, kept: JE-CHK-131-S8-IMPAIRMENT-AND-IFRS15-REVERSAL (monthly test on a four-year contract versus years mapped to periods with the IFRS15 reversal) (ADJUDICATION.md R-DUP-02)."
