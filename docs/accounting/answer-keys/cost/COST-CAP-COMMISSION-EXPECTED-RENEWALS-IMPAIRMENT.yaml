schema: erev-answer-key/1
id: COST-CAP-COMMISSION-EXPECTED-RENEWALS-IMPAIRMENT
title: "Commission amortised over expected renewals, then impaired when renewals are no longer expected"
status: active
families: [COST, REC]
tags: [subscription]
summary: "Capability key for contract costs with expected renewals and impairment (340-40; POL-141 to POL-144; JET-09). A 2026 subscription for 120,000.00 is invoiced upfront. The incremental sales commission of 30,000.00 (capitalised 10 January) relates to the initial term and two expected renewals because renewal commissions are not commensurate, so it is amortised straight line over 36 months (estimate RENEWAL_EXPECTATION version 1): 833.33 / 833.34 a month by cumulative rounding. On 30 June 2026 the customer announces it will not renew (version 2: 12 months). June amortisation completes at the old rate (carrying 25,000.00 after June); the impairment test then compares the carrying amount with remaining expected consideration of 60,000.00 (the unrecognised 2026 fee) less remaining direct costs of 55,000.00 (EAC version for hosting and support): impairment 20,000.00 (JET-09c; 340-40-35-3). The remaining 5,000.00 is amortised over July to December (340-40-35-2, prospective). ASC606 book: no reversal (POL-144). Under JET-09c rev 1.2 the test adds the consideration of renewals still anticipated in the amortisation period; version 2 anticipates none, so that term is nil and the impairment is unchanged (D-76; ADJUDICATION.md R-COST-02)."
