schema: erev-answer-key/1
id: SFC-CAP-DEFERRED-PAYMENT-ROBOT-SALE
title: "Robot cell sold with payment deferred 24 months: revenue at the cash selling price and interest income accreted"
status: active
families: [SFC, REC, POS]
