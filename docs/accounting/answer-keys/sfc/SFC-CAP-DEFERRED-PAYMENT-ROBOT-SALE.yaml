summary: "Capability key for significant financing with deferred payment (POL-046, POL-047 CUSTOMER_CREDIT_RATE; JET-11a; 05 EMOD-18), Bracken Robotics. A robot cell is delivered on 1 January 2026 for 500,000.00 payable in one amount on 31 December 2027. The 24-month gap exceeds the one-year expedient and the terms reflect financing: customer credit rate 6.00% a year (0.50% a month), locked at inception in the contract policy override. Cash selling price = 500,000.00 ÷ 1.005^24, recognised as revenue at transfer (rounded to the cent); interest income is the cumulative-rounded exact effective interest on the financed balance (JET-11a, Dr CONTRACT_LIABILITY / Cr INTEREST_INCOME), so that revenue plus interest equals the 500,000.00 invoiced on 31 December 2027. The right to payment depends only on the passage of time, so the debit position is presented as an unbilled receivable."
