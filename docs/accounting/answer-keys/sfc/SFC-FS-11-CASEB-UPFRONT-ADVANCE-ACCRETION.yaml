id: SFC-FS-11-CASEB-UPFRONT-ADVANCE-ACCRETION
title: "Three-year upfront payment at a discount: advance-payment financing accreted monthly"
status: active
families: [SFC, REC, POS]
tags: [subscription]
summary: "Same subscription paid 270,000.00 upfront instead of 100,000.00 a year. The discount compensates the customer for financing the entity, so the SFC is significant. Rate: POL-047 advance payment, entity incremental borrowing rate 6.00% a year, monthly 0.50%, held in the contract policy override (05 EMOD-18). The cash selling price is the level monthly amount P that settles the 270,000.00 advance with monthly effective interest: B_t = B_(t-1) × 1.005 − P, B_36 = 0. Revenue = round(P × months) cumulative (TIME_ELAPSED, MONTHLY_EVEN); interest expense = cumulative-rounded exact effective interest on the opening advance balance (JET-11b, Dr INTEREST_EXPENSE / Cr CONTRACT_LIABILITY). The transaction price is round(36P); financing adjustment = round(36P) − 270,000.00; contract liability reaches 0.00 on 31 December 2028."
