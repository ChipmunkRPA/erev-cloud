schema: "erev-answer-key/1"
id: "SFC-CHK-136-S3-EX29-ENGINE-CANCELLABLE-UPDATE"
title: "Advance payment with a significant financing component under ENGINE billing: a cancellable invoice becomes the payment point only when its status update makes it noncancellable (D-91 05g)"
status: "active"
families: ["SFC", "JE"]
tags: ["r04-s3"]
summary: "SFC-S3-EX29 derivative (D-91 C606-05g). The customer is to pay 4,000.00 at signing for an asset delivered two years later; the entity's incremental borrowing rate of 6% applies (sfc.discount_rate_basis override ENTITY_BORROWING_RATE, annual rate 0.06, compounding MONTHLY) and the reviewed SFC_ASSESSMENT judges the financing component significant with no payment schedule in force (ENGINE_SPEC S04-R-10a). Billing posts in ENGINE mode (POL-004 ENGINE): the 4,000.00 invoice INV-ADV-1 / INV-ADV-1-1 of 1 January 2026 is cancellable, so it is memo-only (S10-R-06) until the ERP re-sends the line on 20 February 2026 with is_cancellable false and the same amount, an S10-R-07 status update that makes it noncancellable. Under D-91 05g the S04-R-10a payment point is dated the S10-R-06 unconditional date, 20 February, not the memo issue date: no interest accretes in January; 23 month ends separate the point and the 31 December 2027 transfer, so JET-11b posts 4,000.00 x 0.005 = 20.00 in February (contract liability 4,020.00 with JET-03 Dr ACCOUNTS_RECEIVABLE 4,000.00 / Cr CONTRACT_LIABILITY 4,000.00 posted at the unconditional date), the liability stands at 4,000 x 1.005^11 = 4,225.58 at the end of 2026, and revenue on transfer equals the accreted balance 4,000 x 1.005^23 = 4,486.21 (transaction price 4,486.21, financing adjustment 486.21; the noncancellable ERP world of SFC-S3-EX29 gives 24 month ends and 4,508.64). In December 2027 the balance of 4,463.89 accretes 22.32 and JET-02 relieves 4,486.21. A January checkpoint is not asserted: at 31 January the line is memo-only, no eligible payment point exists under the significant judgement and the engine raises SFC_REVIEW_REQUIRED (D-91 05g; the engine test test_c606_05g_memo_only_line_raises_sfc_review_required pins it)."
