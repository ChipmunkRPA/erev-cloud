id: "SFC-CHK-136-S3-EX29-ENGINE-PARTIAL-RECEIPT-APPLIED"
title: "Cancellable ENGINE invoice partly paid, receipt applied: the receipt is the only payment point and the unpaid remainder carries no financing (D-97 (4), A18)"
