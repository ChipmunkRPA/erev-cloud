summary: "SFC-S3-EX29 derivative for D-97 (4) (the A18 question of lane ENG-C6; G12 AD-8). ASSUMPTION FIRST — assuming the unpaid remainder is expected at transfer: this key rests on the explicit pending accounting PREMISE of D-97 (4) v2/v3 that a memo-only document creates no unconditional right and that, absent a stated promised payment date before transfer, payment of the unpaid remainder is expected at transfer, so that the remainder carries no financing component (606-10-32-15/16) and enters the transaction price at its stated amount. The premise is a pending accounting judgement, not a fact encoded by the absence of a payment date; the engine treatment is PROVISIONAL pending AD-8; the engine's result confers no independent accounting authority; this key stays review-pending until the reviewing accountant resolves the premise, any stated or contradictory payment timing in the inputs, and the applied / unapplied scope. World: the customer is to pay 4,000.00 at signing for an asset delivered two years later; the entity's incremental borrowing rate of 6% applies (sfc.discount_rate_basis override ENTITY_BORROWING_RATE, annual rate 0.06, compounding MONTHLY) and the reviewed SFC_ASSESSMENT judges the financing component significant with no payment schedule in force (ENGINE_SPEC S04-R-10a). Billing posts in ENGINE mode (POL-004 ENGINE): the 4,000.00 invoice INV-ADV-1 / INV-ADV-1-1 of 1 January 2026 is cancellable and is never made noncancellable; the customer pays 1,000.00 on 1 January 2026 (applied to the invoice). Figures, which are implementation observations under the assumption above, re-derived with Fraction arithmetic in .run/eng-c6/derive.py (section E) before authoring and never generated from engine output: under the receipts-first fallback (D-87 L5-3-Q-8, D-91 05g) the receipt is the only payment point; interest accretes on it alone, 1,000 x 0.005 = 5.00 in January (balance 1,005.00), 1,061.68 at the end of 2026, 1,127.16 at transfer (the cash selling price of the receipt; financing adjustment 127.16); the transaction price and revenue at transfer are 4,127.16 = 4,000.00 + 127.16 (1,127.16 is never total contract revenue; the combined reading 4,508.64 is rejected for ENGINE mode and remains the ERP / noncancellable result). Applying the receipt to INV-ADV-1 makes the line unconditional on 1 January (S10-R-06): JET-03 posts Dr ACCOUNTS_RECEIVABLE 4,000.00 / Cr CONTRACT_LIABILITY 4,000.00, `billed_cum` is 4,000.00 from January, AR is 4,000.00 less the 1,000.00 applied = 3,000.00 (S10-R-19), and the contract liability is 4,000.00 plus the accretion on the receipt (4,005.00 at 31 January, 4,061.68 at 31 December 2026), relieved at transfer with the December interest: Dr CONTRACT_LIABILITY 4,121.55 / Dr INTEREST_EXPENSE 5.61 / Cr REVENUE 4,127.16."
