summary: "A three-year hosted subscription (2026 to 2028) is paid 300,000.00 upfront on 1 January 2026; the list price for annual billing is 100,000.00 a year. The gap between payment and the midpoint of performance exceeds 12 months, so POL-046 raises an SFC review. The promised consideration equals the cash selling price, so no significant financing component exists (606-10-32-16(a)); the SFC_ASSESSMENT judgement clears the flag. Revenue 300,000.00 on time elapsed (8,333.33 / 8,333.34 a month); financing adjustment 0.00."
