title: "Deferred payment at a below-market rate: revenue at the present value of instalments, monthly interest income (CHK-137; FASB Example 28 Case B)"
status: "active"
families: ["SFC", "POS", "REC"]
summary: "Equipment transfers on 1 January 2026 for 60 monthly instalments of 18,871.00 (a 5% contractual rate on 1,000,000.00), but the customer's market rate is 12% a year. The contract override of sfc.discount_rate_basis carries the basis CUSTOMER_CREDIT_RATE, annual rate 0.12 and compounding MONTHLY (POL-047 rev 1.2), and the booking carries the 60 instalments as payment_schedule (the D-76 billing plan). Discounting the scheduled instalments at 1% a month, instalment k falling due at the k-th month end after transfer, gives revenue of 848,346.53 (FASB states 848,357, the present value of the unrounded instalment). JET-11a posts the period change in round(exact cumulative interest) on the exact financed balance (ENGINE_SPEC S04-R-12; ALG-01 §2.1.3): January 8,483.47, February 8,379.59, 283,913.47 in total, so the last instalment settles the balance to 0.00 exactly. The position includes the accretion posted to the control role (ALG-02 step 3 rev 1.2; D-76): January net position −837,959.00, presented as an unbilled receivable 837,959.00 because the right is unconditional (ALG-03), which equals POLICIES CHK-137. The figures 846,527.30 and 836,121.57 of an earlier generation are superseded (ADJUDICATION.md R-SFC-01)."
