title: "Deferred payment: revenue at the cash selling price and annual accretion to the promised amount (FASB Example 26, financing component)"
status: "active"
families: ["SFC", "REC", "POS"]
summary: "A product is delivered on 1 January 2026 for 121.00 payable on 31 December 2027; its cash selling price is 100.00. The override of sfc.discount_rate_basis carries CUSTOMER_CREDIT_RATE, annual rate 0.10 and compounding ANNUAL, and the booking carries the single payment as payment_schedule. Two whole years separate transfer and payment, so the cash selling price is 121.00 ÷ 1.1² = 100.00 exactly (ENGINE_SPEC S04-R-12): revenue 100.00 at delivery, financing adjustment −21.00. JET-11a accretes interest income of 10.00 in 2026 and 11.00 in 2027, each spread over its months by cumulative rounding (0.83 in January 2026). The debit position is an unbilled receivable because the right is unconditional (ALG-03): 100.83 at the end of January 2026, 110.00 at the end of 2026 and nil once the 121.00 invoice posts on 31 December 2027. FASB Example 26 also grants a 90-day right of return with no history. This key asserts the financing component alone (ADJUDICATION.md R-SFC-03); SFC-S3-EX26-RETURN-RIGHT asserts the example with its return right under ENGINE_SPEC S04-R-12a rev 1.3: no accretion while expected returns exclude the whole consideration, then the 21.00 of interest over months 4 to 24 (ADJUDICATION.md R-SFC-05). Cross-slice variants with distinct inputs, kept: SFC-S3-EX26-RETURN-RIGHT (without versus with the 90-day return right (post-B3 ruling R-SFC-05)) (ADJUDICATION.md R-DUP-02)."
