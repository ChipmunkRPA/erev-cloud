id: "SFC-S3-EX26-RETURN-RIGHT"
title: "Deferred payment with a return right and no history: no accretion until the right lapses, then interest over the remaining months (FASB Example 26)"
status: "active"
families: ["SFC", "RET", "REC"]
summary: "A new product (cost 80.00) is delivered on 1 January 2026 for 121.00 payable on 31 December 2027 with a 90-day return right and no return history. Cash selling price 100.00: CUSTOMER_CREDIT_RATE 0.10 with compounding ANNUAL over the two whole years of the month-end count (ENGINE_SPEC S04-R-12 rev 1.3), financing adjustment −21.00. The RETURN_RATE estimate expects the one unit back until the window ends on 31 March 2026, so the constraint excludes the whole consideration: revenue 0.00, expected_returns_amount −100.00 and transaction price 0.00; no refund liability because nothing is billed or paid; return asset 80.00 (JET-07c). No receivable or contract asset exists, so no interest accretes (606-10-55-232; ENGINE_SPEC S04-R-12a rev 1.3). The right lapses at the end of 31 March 2026 (D-87 L6-5-Q-25): revenue 100.00 and the JET-07c reversal of the return asset post in March 2026, the unbilled receivable is 100.00 at 31 March 2026, and the 21.00 of financing interest is recognised over months 4 to 24 in proportion to the inception schedule's exact interest (10.00 ÷ 12 a month in 2026, 11.00 ÷ 12 in 2027), cumulatively rounded: 0.95 in April 2026, 8.51 for months 4 to 12 and 12.49 for months 13 to 24, the research 04 S3-EX26 figures. The unconditional right presents as an unbilled receivable: 100.95 at the end of April 2026, 108.51 at the end of 2026 and 121.00 before the invoice of 31 December 2027, after which the position is nil (ADJUDICATION.md R-SFC-05). Cross-slice variants with distinct inputs, kept: SFC-S3-EX26 (without versus with the 90-day return right (post-B3 ruling R-SFC-05)) (ADJUDICATION.md R-DUP-02)."
