schema: erev-answer-key/1
id: BRK-JS-02-GIFT-CARDS-BREAKAGE-ESCHEAT
title: "Gift cards: breakage in proportion to redemptions, and no breakage where unclaimed-property law applies"
status: active
families: [BRK, REC]
tags: []
summary: "research 05 §9 worked example. Gift cards of 50,000.00 sold in December 2025 in a jurisdiction without escheat: expected breakage 10% (5,000.00), constrained estimate approved, expected redemptions 45,000.00. Revenue = card value × cumulative redemptions ÷ expected redemptions (POL-055 PROPORTIONAL_TO_EXERCISE): redemptions 27,000.00 in Q1 2026 give revenue 30,000.00 (breakage 3,000.00) and contract liability 20,000.00; redemptions 18,000.00 in Q2 give 20,000.00 (breakage 2,000.00) and liability 0.00. A second cohort of 50,000.00 sold in a jurisdiction whose unclaimed-property law requires remittance of unredeemed balances: the unredeemed 5,000.00 is never breakage (606-10-55-49), the breakage rate is 0 and expected redemptions are 50,000.00, so revenue equals redemptions and 5,000.00 stays a liability after Q2."
