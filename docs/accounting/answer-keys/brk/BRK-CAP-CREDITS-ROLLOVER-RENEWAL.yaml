schema: erev-answer-key/1
id: BRK-CAP-CREDITS-ROLLOVER-RENEWAL
title: "Prepaid API credits rolling into a renewal: breakage measured on expected use including rollover use"
status: active
families: [BRK, MOD, REC]
tags: [usage-rollover]
summary: "Capability key for credits rollover (POLICIES PT-02; POL-241 BREAKAGE_INCLUDING_EXPECTED_ROLLOVER_USE; REQ-MOD-017). A customer prepays 240,000.00 of nonrefundable API credits for 2026. Unused credits roll into the next year if the customer renews. At inception Fernhill expects 150,000.00 of credits to be used in 2026 and 60,000.00 after rollover, and 30,000.00 never to be used, so expected total use is 210,000.00 and breakage is recognised in proportion to use (606-10-55-48): revenue = credits sold × cumulative use ÷ expected total use. Use: 70,000.00 by 30 June and 150,000.00 by 31 December 2026 (revenue 171,428.57; contract liability 68,571.43, of which expected breakage 8,571.43). The customer renews on 31 December 2026 and the rolled credits' expiry extends to 31 December 2027 (modification, no consideration). Rolled credits of 60,000.00 are used by 30 June 2027: cumulative revenue 240,000.00; liability 0.00. Had the customer not renewed, the remaining 68,571.43 would be recognised when the rights lapse."
