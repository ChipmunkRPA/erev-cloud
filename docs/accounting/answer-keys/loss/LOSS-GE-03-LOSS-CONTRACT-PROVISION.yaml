schema: erev-answer-key/1
id: LOSS-GE-03-LOSS-CONTRACT-PROVISION
title: "Anticipated loss on a fixed-price bridge retrofit: provision recognised in full and released as work is performed"
status: active
families: [LOSS, REC, POS]
tags: [construction]
summary: "Granitefield Engineering Canada (CAD) retrofits a bridge for a fixed 2,400,000.00 on cost-to-cost; EAC 2,000,000.00. Costs to date: 800,000.00 (30 June 2026), 1,300,000.00 (30 September), 1,950,000.00 (31 December), 2,600,000.00 at completion (31 March 2027). On 30 September a steel overrun raises the EAC to 2,600,000.00: total expected loss 200,000.00; loss already recognised through margin to date = costs 1,300,000.00 − revenue 1,200,000.00 = 100,000.00; required provision 100,000.00 (JET-12; POL-153). As loss-making work is performed the provision is released so remaining work shows nil margin: 50,000.00 at 31 December, 0.00 at completion. The loss test runs at contract level (POL-150 CONTRACT). The contract is a Subtopic 605-35 construction contract (scope_605_35 true), so the ASC606 book tests it under the default POL-151 SCOPED_605_35_ONLY (ADJUDICATION.md R-SCH-03). Progress billings 900,000.00 / 600,000.00 / 900,000.00."
