schema: "erev-answer-key/1"
id: DLT-NATIVE-SUBSCRIPTION-PRE-STANDARD-UPFRONT
title: "Delta posting when legacy GAAP booked the full subscription fee on invoice"
status: active
families: [DLT, JE]
tags: [subscription]
summary: >-
  Entity US01, USD, books ASC606 and LEGACY, je.posting_mode DELTA, ERP billing. A 12,000.00 subscription for 2026
  (MONTHLY_EVEN) is invoiced on 1 January and the ERP books 12,000.00 of pre-standard revenue that day [A: legacy
  policy recognised billed fees]. ASC606 book: JET-02 Dr CONTRACT_LIABILITY / Cr REVENUE 1,000.00 a month. LEGACY book
  (JET-15): January Dr PRE_STANDARD_REVENUE 12,000.00 / Cr CONTRACT_LIABILITY 12,000.00. The January delta journal
  (primary plus LEGACY lines by account) is therefore Dr revenue 11,000.00 / Cr contract liability 11,000.00, and
  February's is the ASC606 line alone. The pre-standard cumulative amount rolls on every version (REQ-BK-005).
