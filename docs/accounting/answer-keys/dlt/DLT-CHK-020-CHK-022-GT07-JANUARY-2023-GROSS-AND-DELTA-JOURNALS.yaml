summary: >-
  Legacy-parity world with entities ME1 and ME2, books ASC606 and LEGACY, je.posting_mode DELTA (POL-005). January
  2023: Contract 1 (ME1) is invoiced 100.00 on POB #1 to POB #3 and delivers 2 of 5 hardware units, 1 of 2 software
  units and half of the consulting; the ERP booked pre-standard revenue 66.00 (POB #2) and 88.00 (POB #3). Contract 2
  (ME2) delivers one hardware unit, unbilled. ASC606 book: ME1 Dr 21001 295.69 / Cr 5001 128.84, 5002 118.53, 5003
  48.32; ME2 revenue 58.85 presented as unbilled A/R 15002 by JET-06, so 21002 nets to zero. LEGACY book (JET-15): ME1
  Dr PRE_STANDARD_REVENUE 5002 66.00 and 5003 88.00 / Cr 21001 154.00. DELTA journal runs: ME1 Dr 21001 141.69, Dr
  5003 39.68 / Cr 5001 128.84, Cr 5002 52.53 (181.37 each side); ME2 Dr 15002 58.85 / Cr 5001 58.85. Summed over both
  entities these equal legacy TC-JE-02 and CHK-020 (240.22 each side). The GROSS runs equal TC-JE-01 (CHK-022).
