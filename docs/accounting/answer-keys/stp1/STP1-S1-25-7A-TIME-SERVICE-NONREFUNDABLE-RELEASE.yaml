schema: "erev-answer-key/1"
id: "STP1-S1-25-7A-TIME-SERVICE-NONREFUNDABLE-RELEASE"
title: "Nonrefundable deposit on a completed, fully paid time-elapsed service released under 606-10-25-7(a) at the term end (D-91 T1)"
status: "active"
families: ["STP1", "JE"]
summary: "A one-year service of 1,200.00 (1 January to 31 December 2026, TIME_ELAPSED, MONTHLY_EVEN) is booked while collectibility is not probable, so the contract is NOT_A_CONTRACT in the ASC606 book; 1,200.00 is received on 15 February (JET-01b: Dr BILLING_CLEARING UNAPPLIED_CASH / Cr DEPOSIT_LIABILITY) and the reviewed NOT_A_CONTRACT record concludes the consideration is nonrefundable. Under S02-R-07(a) rev 1.6 (D-91 gaps (ii), (iii)) an OVER_TIME TIME_ELAPSED obligation with a resolved term is fully transferred from its term end inclusive, so the deposit is recognised at the dated point 31 December 2026, ordered after every event of that date: Dr DEPOSIT_LIABILITY 1,200.00 / Cr REVENUE 1,200.00 in FY2026-P12, a TIME amount of the CLOSE_RELEASE pass. Nothing is due at the November horizon. The status stays NOT_A_CONTRACT, the stage 09 revenue targets stay 0 (S02-R-03) and the obligation is excluded from RPO (D-91 gaps (vii)); the release reaches revenue through JET-01b and the disaggregation report (S15-R-16)."
