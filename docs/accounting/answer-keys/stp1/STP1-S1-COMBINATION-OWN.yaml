title: "Two contracts negotiated as a package combined: allocation across the group and netting per group"
status: "active"
families: ["STP1", "ALC", "POS"]
summary: "On 10 January the customer signs a licence contract for 90,000.00 (SSP 100,000) and on 20 January an implementation contract for 60,000.00 (SSP 50,000), negotiated as a package with a single commercial objective, so they are combined (606-10-25-9(a)). The group transaction price 150,000.00 is allocated licence 100,000.00 and services 50,000.00. The licence transfers and is invoiced (90,000.00) in January; services run by whole months over February and March and are invoiced 30,000.00 each month. The group is one presentation unit: the January debit of 10,000.00 is a contract asset (the right depends on performing the services), falling to 5,000.00 in February and nil in March. The netting reclass reverses each first day. Without combination, revenue would have been 90,000.00 / 30,000.00 / 30,000.00. The group's labelled balances are asserted through the checkpoint block groups (dev-guide DG-AK-57; ADJUDICATION.md R-SCH-05)."
