summary: "A building is sold for 1,000,000.00 with a nonrefundable 50,000.00 deposit and seller financing on a nonrecourse basis. Collection is not probable, so criterion 606-10-25-1(e) is not met and the contract is NOT_A_CONTRACT in the ASC606 book. Receipts are recognised as a deposit liability (606-10-25-8; JET-01b: Dr BILLING_CLEARING UNAPPLIED_CASH / Cr DEPOSIT_LIABILITY): 50,000.00 on 1 January and 6,500.00 of principal and interest on 28 February. No revenue, receivable or contract liability arises, and none of the 606-10-25-7 events has occurred. The building stays in the ERP's fixed assets, so no delivery event is recorded."
