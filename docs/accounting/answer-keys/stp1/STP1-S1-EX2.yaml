id: "STP1-S1-EX2"
title: "Implicit price concession reduces the transaction price, not a credit loss (FASB Example 2; engine billing)"
status: "active"
families: ["STP1", "VC", "JE"]
summary: "1,000 units of a drug are invoiced at 1,000,000.00; the entity expects to accept 400,000.00 and concludes that collection of that amount is probable, so the contract passes 606-10-25-1(e) and the 600,000.00 difference is an implicit price concession (606-10-32-7). Transaction price 400,000.00; revenue 400,000.00 on transfer. In ENGINE billing mode the invoice posts Dr ACCOUNTS_RECEIVABLE 1,000,000.00 / Cr CONTRACT_LIABILITY, revenue relieves the contract liability by 400,000.00 and JET-04c credits RECEIVABLE_CONTRA 600,000.00 (kappa = 0.60), so the net receivable is 400,000.00, the contract liability nil and no credit-loss line exists. Cross-slice variants with distinct inputs, kept: JE-CHK-138-S1-EX2-IMPLICIT-PRICE-CONCESSION-RECEIVABLE-CONTRA (different estimate inputs and events) (ADJUDICATION.md R-DUP-02)."
