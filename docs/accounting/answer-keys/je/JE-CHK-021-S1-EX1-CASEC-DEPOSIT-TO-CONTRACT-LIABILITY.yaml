id: JE-CHK-021-S1-EX1-CASEC-DEPOSIT-TO-CONTRACT-LIABILITY
title: >-
  JET-01b: receipts while not a contract build a deposit liability, reclassified when the criteria are met
status: active
families: [JE, STP1]
tags: [r04-s1]
summary: >-
  Research 04 worked example 1.1-B Case C re-anchored to 2026. Entity US01, USD, ERP billing, runner engine. A
  12-month service at 20.00 a month (240.00, MONTHLY_EVEN) fails the collectibility criterion at inception
  (NOT_A_CONTRACT). The customer pays 20.00 on the 5th of each month from January to June; each receipt posts Dr
  BILLING_CLEARING (clearing_purpose UNAPPLIED_CASH) / Cr DEPOSIT_LIABILITY 20.00, reaching 100.00 at 31 May. The
  criteria are met on 30 June (CONTRACT_CRITERIA_MET, POL-013 CATCH_UP_AT_TRANSITION): Dr DEPOSIT_LIABILITY 120.00 /
  Cr CONTRACT_LIABILITY 120.00, then JET-02 Dr CONTRACT_LIABILITY 120.00 / Cr REVENUE 120.00 for the six months
  performed (CHK-021). Closing deposit liability 0.00, contract liability 0.00, revenue 120.00. Cross-slice variants
  with distinct inputs, kept: STP1-S1-EX1-CASEB-C-VARC (different receipts, dates and policies) (ADJUDICATION.md
  R-DUP-02).
