summary: >-
  FASB Example 2 (research 04 S1-EX2) re-anchored to 2026. Entity US01, USD, billing.posting ENGINE (D-14a). 1,000
  units are transferred and invoiced 1,000,000.00 on 2026-03-15; the entity expects to collect 400,000.00, an implicit
  price concession (estimate kind IMPLICIT_PRICE_CONCESSION, rate κ = 0.6). The transaction price is 400,000.00.
  JET-03 Dr ACCOUNTS_RECEIVABLE / Cr CONTRACT_LIABILITY 1,000,000.00; JET-02 Dr CONTRACT_LIABILITY / Cr REVENUE
  400,000.00; JET-04c Dr CONTRACT_LIABILITY / Cr RECEIVABLE_CONTRA round(1,000,000 × 0.6) = 600,000.00. Revenue
  400,000.00, net receivable 400,000.00, contract liability 0.00 and no credit-loss line (CHK-138; POL-125).
  Cross-slice variants with distinct inputs, kept: STP1-S1-EX2 (different estimate inputs and events) (ADJUDICATION.md
  R-DUP-02).
