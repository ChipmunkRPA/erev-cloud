summary: >-
  FASB Example 38 (606-10-55-284 to 55-286) re-anchored to 2026. Entity US01, USD, billing.posting ENGINE. A product
  is to transfer on 31 March for 1,000.00 payable in advance on 31 January; the customer pays on 1 March; control
  transfers on 31 March. Case A, cancellable contract: the invoice issued on 31 January is memo-only until cash is
  received (POL-123): no receivable and no contract liability at 31 January. On 1 March JET-03 posts Dr
  ACCOUNTS_RECEIVABLE / Cr CONTRACT_LIABILITY 1,000.00; on 31 March JET-02 Dr CONTRACT_LIABILITY / Cr REVENUE 1,000.00
  (CHK-024 Case A). The ERP's cash application clears the receivable outside the engine. This key also carries the
  assertions of POS-S9-PRESENTATION-EX38-CASEA, withdrawn as its true duplicate (ADJUDICATION.md R-DUP-01).
