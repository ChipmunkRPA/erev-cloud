summary: >-
  Research 04 S3-EX21-EXTENDED (FASB Example 21 extended) with years 20X7 to 20X9 re-anchored to 2026 to 2028 on a
  monthly calendar. Entity US01, USD, ERP billing. Base consideration 2,500,000.00; timing incentive element
  (EXPECTED_VALUE over +100,000 at 20%, 0 at 50%, −50,000 at 30%) included at 5,000.00; completion bonus 150,000.00
  (MOST_LIKELY_AMOUNT) constrained to 0.00 in version 1. Output progress [A in place of cost-to-cost] 40% on
  2026-12-31, 80% on 2027-12-31 and 100% on 2028-12-31; invoices 1,000,000.00 at each year end. Year 1 revenue
  1,002,000.00 and contract asset 2,000.00. Bonus version 2, effective 2027-01-01 while progress is still 40%,
  includes 150,000.00: January 2027 posts JET-04a 60,000.00 (CHK-026), which POL-204 reports as revenue from
  obligations satisfied in previous periods, ΔX × f(s) = 150,000 × 40% (CHK-100). Year 2 progress revenue
  1,062,000.00; Year 2 revenue 1,122,000.00; contract asset 124,000.00 at 2027-12-31. The timing element resolves at
  +100,000.00 on 2028-12-31: Year 3 revenue 626,000.00, final transaction price 2,750,000.00, position nil.
  Cross-slice variants with distinct inputs, kept: VC-CHK-100-S3-EX21-EXTENDED (cost-to-cost progress versus output
  progress events) (ADJUDICATION.md R-DUP-02).
