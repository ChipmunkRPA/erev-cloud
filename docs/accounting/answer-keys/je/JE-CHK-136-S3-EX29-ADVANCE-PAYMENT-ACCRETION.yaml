summary: >-
  FASB Example 29 facts (research 04 S3-EX29) re-anchored to 2026: an asset is sold for 4,000.00 paid on 1 January
  2026 with transfer on 1 January 2028; the entity's incremental borrowing rate is 6% (POL-047 ENTITY_BORROWING_RATE,
  one approved contract-level override with annual_rate 0.06, SFC judgement recorded). Entity US01, USD, ERP billing.
  EMOD-18 builds a monthly effective-interest schedule; [J] the monthly rate is annual_rate ÷ 12 and cumulative
  interest is round(4,000 × (1.005^m − 1)) (ALG-01 over exact cumulative interest), so JET-11b Dr INTEREST_EXPENSE /
  Cr CONTRACT_LIABILITY totals 246.71 in 2026 and 261.93 in 2027 (cumulative 508.64), and JET-02 recognises 4,508.64
  on transfer. POLICIES CHK-136 and research 04 compound annually (240.00, 254.40, 4,494.40); the difference is
  discrepancy D-AK-05 and OQ-AK-05 in the coverage file. Cross-slice variants with distinct inputs, kept: SFC-S3-EX29
  (transfer on 31 December 2027 versus 1 January 2028) (ADJUDICATION.md R-DUP-02).
