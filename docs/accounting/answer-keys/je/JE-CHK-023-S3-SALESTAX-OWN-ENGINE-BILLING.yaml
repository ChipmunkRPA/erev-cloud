title: >-
  JET-03 under ENGINE billing: sales tax to SALES_TAX_PAYABLE, excluded from the transaction price
status: active
families: [JE, TAX]
tags: [r04-s3]
summary: >-
  Research 04 worked example 3.7 re-anchored. Entity US01, USD, billing.posting ENGINE, US election to exclude
  in-scope taxes (POL-045 EXCLUDE_ALL_IN_SCOPE). A product sold for 1,000.00 plus 8% sales tax: the noncancellable
  invoice carries amount 1,000.00 and tax_amount 80.00 [A payload convention: amount excludes tax]. JET-03: Dr
  ACCOUNTS_RECEIVABLE 1,080.00 / Cr CONTRACT_LIABILITY 1,000.00, Cr SALES_TAX_PAYABLE 80.00; on transfer JET-02 Dr
  CONTRACT_LIABILITY 1,000.00 / Cr REVENUE 1,000.00 (CHK-023). The 2% gross-receipts tax is the entity's own expense
  and no engine posting. Cross-slice variants with distinct inputs, kept: TAX-S3-SALESTAX-OWN (different inception
  date and invoice terms) (ADJUDICATION.md R-DUP-02).
