title: >-
  JET-12: anticipated loss provided when the EAC rises above the price, released as the loss is incurred
status: active
families: [JE, LOSS]
tags: [r04-s7]
summary: >-
  Research 04 S7-LOSS-OWN re-anchored to 2026 to 2028 on a monthly calendar with year-end events. Entity US01, USD,
  ERP billing; the contract is a Subtopic 605-35 contract (scope_605_35 true), so the ASC606 book tests it under the
  default POL-151 SCOPED_605_35_ONLY (ADJUDICATION.md R-SCH-03). Fixed price 1,000,000.00, cost-to-cost progress. Year
  1: EAC 900,000.00, costs 450,000.00, revenue 500,000.00, no provision. Year 2: EAC 1,100,000.00, cumulative costs
  770,000.00, progress 70%, revenue 200,000.00; total expected loss 100,000.00 less the 70,000.00 already recognised
  through margin gives JET-12 Dr LOSS_EXPENSE 30,000.00 / Cr LOSS_PROVISION 30,000.00. Year 3: costs 1,100,000.00,
  revenue 300,000.00, the provision is released 30,000.00 (CHK-132). Invoices equal each year's revenue, so the
  position stays nil. Cross-slice variants with distinct inputs, kept: LOSS-S7-LOSS-OWN (unbilled contract versus
  yearly invoices) (ADJUDICATION.md R-DUP-02).
