status: active
families: [JE, COST, IFRS]
tags: [r04-s8, r04-s13]
summary: >-
  Research 04 S8-CONTRACT-COSTS impairment example with its years mapped to monthly periods [A]. Entity US01, USD, ERP
  billing, tenant POL-090 MONTHLY_EVEN and POL-140 DO_NOT_APPLY (so the four-period asset is capitalised). A service
  contract of 400,000.00 over January to April 2026; commission 40,000.00 capitalised on 2026-01-01 and amortised over
  the four periods. EAC version 1 effective 2026-01-31: remaining direct costs 285,000.00. January: JET-09b 10,000.00;
  carrying 30,000.00 against remaining consideration 300,000.00 − 285,000.00 = 15,000.00, so JET-09c impairs
  15,000.00. February: the reduced carrying amortises over the three remaining periods (5,000.00); EAC version 2
  effective 2026-02-28 gives recoverable 200,000.00 − 175,000.00 = 25,000.00; ASC606 carrying 10,000.00 with no
  reversal (POL-144 PROHIBITED); IFRS15 reverses min(25,000.00, unimpaired carrying 20,000.00) − 10,000.00 =
  10,000.00, carrying 20,000.00 (CHK-131; IFRS 15.104). Cross-slice variants with distinct inputs, kept:
  COST-S8-CONTRACT-COSTS-IMPAIRMENT (monthly test on a four-year contract versus years mapped to periods with the
  IFRS15 reversal) (ADJUDICATION.md R-DUP-02).
