id: JE-CHK-025-S3-EX24-VOLUME-REBATE-REFUND-LIABILITY
title: >-
  JET-04a and JET-04b: retrospective volume rebate becomes expected in Q2; catch-up and refund liability
status: active
families: [JE, VC, POS]
tags: [r04-s3]
summary: >-
  FASB Example 24 re-anchored to 2026 (research 04 S3-EX24). Entity US01, USD, ERP billing. Product at 100.00 per
  unit, retrospectively re-priced to 90.00 if the customer buys more than 1,000 units in the year. [A] The key books
  the 575 units ordered so far as one line of 57,500.00. Q1: 75 units ship on 2026-02-15 and are invoiced 7,500.00;
  the rebate estimate v1 (MOST_LIKELY_AMOUNT) is 0.00, so revenue is 7,500.00. Q2: 500 units ship and are invoiced
  50,000.00 on 2026-05-20, and estimate v2 now expects the threshold: the rebate of 10.00 on all 575 units billed
  (5,750.00) reduces the transaction price to 51,750.00; the estimate version is recorded before the May shipment. May
  posts JET-02 at the revised unit allocation 90.00 (45,000.00), JET-04a for the 75 Q1 units (Dr REVENUE 750.00) and
  JET-04b Dr CONTRACT_LIABILITY 5,750.00 / Cr REFUND_LIABILITY 5,750.00; the aggregated May lines are Dr
  CONTRACT_LIABILITY 50,000.00 / Cr REVENUE 44,250.00, Cr REFUND_LIABILITY 5,750.00 (CHK-025). End of Q2: revenue
  51,750.00, refund liability 5,750.00, position nil. Cross-slice variants with distinct inputs, kept: VC-S3-EX24
  (VOLUME_TIER versus REBATE element; different dates and invoices) (ADJUDICATION.md R-DUP-02).
