schema: "erev-answer-key/1"
id: JE-CHK-130-S8-CONTRACT-COSTS-EX2-AMORTISATION
title: >-
  JET-09a and 09b: commission and fulfilment asset capitalised against CONTRACT_COST_CLEARING and amortised
status: active
families: [JE, COST, RND]
tags: [r04-s8]
summary: >-
  Research 04 S8-CONTRACT-COSTS example 2 re-anchored to 2026. Entity US01, USD, ERP billing, tenant POL-090
  MONTHLY_EVEN so straight-line amortisation (POL-143) runs by whole months. A seven-year managed-service contract
  (700,000.00 over 2026-01-01 to 2032-12-31) with an incremental sales commission of 10,000.00 and attested fulfilment
  set-up costs of 140,000.00 [A amortisation period = contract term of 84 months; no renewals]. January 2026: JET-09a
  Dr COST_TO_OBTAIN_ASSET 10,000.00 and Dr COST_TO_FULFILL_ASSET 140,000.00 / Cr CONTRACT_COST_CLEARING 150,000.00;
  JET-09b month 1 amortisation 119.05 and 1,666.67. Cumulative rounding of 10,000 × k ÷ 84 gives annual commission
  amortisation 1,428.57 in years 1 to 3 and 5 to 7 and 1,428.58 in year 4; the fulfilment asset amortises 20,000.00 a
  year (CHK-130; CHK-006 row S8 ex2). No EAC exists, so the impairment test uses zero remaining costs and never
  impairs. Cross-slice variants with distinct inputs, kept: COST-S8-CONTRACT-COSTS-EX2 (600,000.00 over five years
  versus 700,000.00 over seven) (ADJUDICATION.md R-DUP-02).
