summary: >-
  Legacy-parity preset (POL-121 CUMULATIVE_SSP_DELIVERED), entity ME2, USD, ERP billing. Golden Contract 2: Hardware 1
  8 units stated 600 (clamped to SSP 612), Software 1 3 units stated 400 (clamped to 408), Consulting 1 stated 0 (SSP
  150) and the VC row −100 (SSP 0); transaction price 900.00 allocates 470.77 / 313.85 / 115.38 / 0.00. One hardware
  unit transfers on 2023-01-31 (58.85) and consulting reaches 40% on 2023-03-31 (46.15); nothing is billed. At 31
  March NP = −105.00 and the reclass apportions it by SSP delivered 76.5 and 60: 58.85 and 46.15 (CHK-011). The March
  entity batch nets to Dr 15002 46.15 / Cr 5003 46.15, as legacy TC-delivery-04 reports. [A] All three priced lines
  carry an approved UNCONDITIONAL class (payment due on delivery), so the reclass role is UNBILLED_RECEIVABLE; both
  presentation roles map to 15002 under the preset. Cross-slice variants with distinct inputs, kept: POS-CHK-011-GT06
  (different golden steps and contract scope) (ADJUDICATION.md R-DUP-02).
