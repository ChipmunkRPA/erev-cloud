summary: "On 1 January 2026 a customer contracts for a product transferring on 31 March; 1,000.00 is payable in advance on 31 January, the contract is cancellable, the customer pays on 1 March and the product transfers on 31 March. Before cash is received there is no unconditional right, so the 31 January invoice is memo-only (POL-123, 606-10-55-286): receivable and contract liability 0.00 at 31 January. On receipt JET-03 posts Dr ACCOUNTS_RECEIVABLE / Cr CONTRACT_LIABILITY 1,000.00 (the ERP's cash application clears the receivable); on transfer revenue 1,000.00 relieves the contract liability. Withdrawn in design phase B3 as a true duplicate of JE-CHK-024-S9-PRESENTATION-EX38-CASEA-CANCELLABLE: same inputs as the kept key apart from invoice and receipt references; every shared leaf agrees (ADJUDICATION.md R-DUP-01)."
