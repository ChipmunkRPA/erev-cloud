summary: "One contract, one entity, ERP billing. P1 time and materials (unconditional): revenue 3,000.00 (120 hours x 25.00), billed 0.00. P2 milestone (conditional): revenue 10,000.00, billed 4,000.00. P3 build (conditional): revenue 1,000.00 (50% of 2,000.00), billed 5,000.00. Net position = 9,000.00 - 14,000.00 = -5,000.00. U = max(0, 3,000.00 - 0.00) = 3,000.00, so the unbilled receivable is 3,000.00 and the contract asset 2,000.00. Under POB_DEBIT_POSITIONS the unbilled receivable goes to P1 and the whole contract asset to P2, the only conditional POB with a debit position. JET-06 on 31 January: Dr UNBILLED_RECEIVABLE 3,000.00 and Dr CONTRACT_ASSET 2,000.00 / Cr CONTRACT_LIABILITY 5,000.00, each paired on its POB string; the reversal posts on 1 February. Cross-slice variants with distinct inputs, kept: POS-CHK-010-UNBILLED-RECEIVABLE-AND-CONTRACT-ASSET-SPLIT (different obligations, prices and events) (ADJUDICATION.md R-DUP-02)."
