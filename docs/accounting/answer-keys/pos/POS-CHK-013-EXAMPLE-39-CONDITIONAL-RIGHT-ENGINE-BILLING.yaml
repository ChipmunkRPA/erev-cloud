title: >-
  FASB Example 39: contract asset while payment depends on the second product; receivable on invoice
status: active
families: [POS, JE]
tags: [r04-s9]
summary: >-
  Entity US01, USD, billing.posting ENGINE. Products A (400.00) and B (600.00) for 1,000.00 payable only when both
  transfer, so both obligations carry the CONDITIONAL class (606-10-55-287 to 55-290). A transfers on 2026-01-20: NP =
  −400.00, contract asset 400.00, no receivable. B transfers and the noncancellable invoice issues on 2026-02-15:
  JET-03 Dr ACCOUNTS_RECEIVABLE 1,000.00 / Cr CONTRACT_LIABILITY 1,000.00; NP = 0, contract asset 0.00, receivable
  1,000.00 (CHK-013). Cross-slice variants with distinct inputs, kept: POS-CHK-013-S9-PRESENTATION-EX39 (stated prices
  500.00 / 500.00 versus 400.00 / 600.00 and different dates) (ADJUDICATION.md R-DUP-02).
