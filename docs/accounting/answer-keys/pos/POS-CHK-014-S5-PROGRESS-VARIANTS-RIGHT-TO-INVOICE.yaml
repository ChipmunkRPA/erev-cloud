title: >-
  Right to invoice: December hours presented as unbilled receivable until the January invoice
status: active
families: [POS, REC]
tags: [r04-s5]
summary: >-
  Research 04 worked example 5.2-B item 2 (FASB Example 42 Contract A rate). Entity US01, USD, ERP billing. Cleaning
  services of 120 hours at 25.00 per hour (3,000.00) performed in December 2026 and measured by RIGHT_TO_INVOICE; the
  class defaults to UNCONDITIONAL (table 2.4-A). December revenue 3,000.00, NP = −3,000.00, unbilled receivable
  3,000.00 and contract asset 0.00. The invoice issued on 2027-01-10 settles the position: unbilled receivable 0.00
  and contract liability 0.00 at 31 January (CHK-014). Cross-slice variants with distinct inputs, kept:
  REC-CHK-014-S5-PROGRESS-VARIANTS-RTI (delivery events versus usage reports; different terms) (ADJUDICATION.md
  R-DUP-02).
