id: POS-CHK-012-S9-PRESENTATION-NETTING-PER-CONTRACT
title: >-
  Netting within a contract only: contract X presents a 30,000.00 asset, contract Y a separate liability
status: active
families: [POS, DISC]
tags: [r04-s9]
summary: >-
  Research 04 worked example 9-C (own example). Entity US01, USD, ERP billing, runner platform because two independent
  contracts are computed. Contract X: licence 60,000.00 transferred in P1 (January 2026) and services 40,000.00
  performed 50% in P1 and 50% in P2; noncancellable invoices P1 10,000.00 (licence) and 40,000.00 (services), P2
  50,000.00 (licence). End P1: R 60,000 / 20,000, B 10,000 / 40,000, NP = −30,000.00, presented as a 30,000.00
  contract asset and no contract liability, not a 50,000.00 asset and a 20,000.00 liability. Contract Y with the same
  customer, not combined, holds a 5,000.00 advance: contract liability 5,000.00, never netted with X (POL-120,
  CHK-012). End P2: X position nil. [A] Both X obligations carry the CONDITIONAL class. Cross-slice variants with
  distinct inputs, kept: POS-CHK-012-S9-PRESENTATION-NETTING (different contracts and dates; platform runner)
  (ADJUDICATION.md R-DUP-02).
