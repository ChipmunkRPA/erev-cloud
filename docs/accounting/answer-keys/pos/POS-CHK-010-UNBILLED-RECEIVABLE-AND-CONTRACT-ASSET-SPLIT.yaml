summary: >-
  One contract, entity US01, USD, ERP billing. P1 field-service visit (3,000.00, unconditional right: only invoicing
  remains), P2 milestone deliverable (10,000.00, conditional) and P3 survey work over time (5,000.00, conditional);
  SSPs equal stated prices. In March 2026 P1 and P2 transfer and P3 reaches 20%; invoices 4,000.00 reference P2 and
  5,000.00 reference P3. R = 3,000 / 10,000 / 1,000 and B = 0 / 4,000 / 5,000, so NP = −5,000.00, U = 3,000.00, UR =
  3,000.00 and CA = 2,000.00, all attributed to P2 under POB_DEBIT_POSITIONS (CHK-010); JET-06 books Dr UR 3,000.00
  and Dr CA 2,000.00 against Cr CL 5,000.00 and reverses on 1 April. In April P1 is invoiced 3,000.00 and P3 reaches
  60%: NP = −4,000.00, UR 0.00 and CA 4,000.00 (P2). Cross-slice variants with distinct inputs, kept: POS-CHK-010
  (different obligations, prices and events) (ADJUDICATION.md R-DUP-02).
