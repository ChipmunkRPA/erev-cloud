summary: >-
  The inputs of POS-CHK-010-UNBILLED-RECEIVABLE-AND-CONTRACT-ASSET-SPLIT run through the platform. At 31 March 2026
  JET-06 books Dr UNBILLED_RECEIVABLE 3,000.00 (P1, delivered 10 March) and Dr CONTRACT_ASSET 2,000.00 (P2, accepted
  20 March) against Cr CONTRACT_LIABILITY 5,000.00. The ASC 326 population export (POLICIES PT-07; RPT-36
  balance_aging, POL-125 EXTERNAL_MODEL) totals the same balances, both in the 0 to 30 day bucket because the revenue
  arose in the period (CHK-117); nothing is in the 31 to 90 day bucket. Row keys are `contract:<external id>:<role>`
  (SCREENS_B RPT-36; DG-AK-35 keeps a value that contains a colon).
