schema: erev-answer-key/1
id: POS-GE-07-RETAINAGE-PRESENTATION
title: "Retainage withheld until completion presented as a contract asset, not a receivable"
status: active
families: [POS, REC]
tags: [construction]
summary: "Office building for 2,000,000.00 on cost-to-cost (EAC 1,600,000.00). Each certified pay application is invoiced at 90%; 10% retainage is withheld and billed only after completion and acceptance, so the right to the retainage is conditional on something other than the passage of time (606-10-45-3; research 05 §6 pitfall 5). Costs 800,000.00 (30 June), 400,000.00 (30 September) and 400,000.00 (15 December, complete); invoices 900,000.00, 450,000.00 and 450,000.00; retainage of 200,000.00 invoiced on acceptance, 31 December. The earned-but-unbilled retainage is a contract asset: 100,000.00 at 30 June, 150,000.00 at 30 September, 0.00 at year end."
