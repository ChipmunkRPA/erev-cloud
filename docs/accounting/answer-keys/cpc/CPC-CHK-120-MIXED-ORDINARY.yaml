id: "CPC-CHK-120-MIXED-ORDINARY"
title: "Ordinary incentive release and share-based reduction on one contract: two JET-14 parts rounded separately that sum with no residue (CHK-120, CHK-133; D-91)"
status: "active"
families: ["CPC", "JE"]
summary: "A distributor buys supplies at 1.00 a unit and receives warrants with a grant-date fair value of 50,000.00 that vest if it buys at least 1,000,000.00 in two years. The booking carries the promise as consideration_payable with share_based true, measured by a SHARE_BASED_CONSIDERATION estimate (grant_date, grant_date_fair_value, vesting_probable; expected related revenue 1,000,000.00). The cumulative reduction is the fair value × (1 when vesting is probable, else 0) × posted cumulative related REVENUE ÷ expected related revenue, capped at the fair value; invoices never drive it (POLICIES PT-10 rev 1.7; ENGINE_SPEC S04-R-17 rev 1.6; ENGINE_SPEC_B S10-R-26; D-91 C606-03). JET-14 posts the period change Dr REVENUE / Cr BILLING_CLEARING (EQUITY). The same 12-month DAILY service of 1,200,000.00 billed 300,000.00 at the end of the first month of each quarter carries an ordinary promise of 10,000.00 released on committed purchases of 900,000.00 (POL-049 COMMITTED_PURCHASES; JET-14 promised Dr CUSTOMER_INCENTIVE_ASSET / Cr CONSIDERATION_PAYABLE 10,000.00 in January) beside the warrants. The release part is round_half_up of its own exact value: 3,333.33 in January, 6,666.67 cumulative in April and 10,000.00 in July (Dr REVENUE / Cr CUSTOMER_INCENTIVE_ASSET); the share-based part is rounded on its own (4,246.58 in January, 3,835.61 in February, 4,109.59 in April); the two parts sum to the revenue reduction with no further rounding (ENGINE_SPEC_B S14-R-01, S14-R-11; D-91 (5): main rounded the sum and posted the release as the difference, a spurious 0.01 in February). The incentive asset is promised less released (6,666.67 after January, 3,333.33 after April, 0.00 after July); the payable stays 10,000.00; the version memo consideration_payable_amount carries both promises, −60,000.00 (S04-R-14)."
