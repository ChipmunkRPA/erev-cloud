schema: erev-answer-key/1
id: CPC-BR-07-CASEA-MDF-DISTINCT-SERVICE-FAIR-VALUE
title: "Market development funds paid for a distinct advertising service at fair value: no revenue reduction"
status: active
families: [CPC, POB]
tags: []
summary: "A distributor buys 10,000 servo drives at 100.00 (1,000,000.00) under a noncancellable 2026 blanket order, shipped and invoiced 2,500 a quarter. Bracken pays the distributor 40,000.00 of market development funds for a co-branded advertising campaign that Bracken could have bought from an agency; third-party quotes support a fair value of 40,000.00. The payment buys a distinct service at fair value (606-10-32-26), so it is a purchase from a supplier recorded in the ERP, not consideration payable to a customer: revenue is the gross 1,000,000.00 and no incentive asset or payable is posted by the engine. The expected-purchases estimate carries the payment (unconstrained) and 0.00 as the amount that reduces the transaction price (constrained)."
