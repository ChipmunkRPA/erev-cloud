id: "CPC-CHK-120-FRACTIONAL-CAP"
title: "Share-based consideration payable with fractional cents and the fair-value cap: one rounding per period, deltas carry the rounding (CHK-120; D-91)"
status: "active"
families: ["CPC", "REC"]
summary: "A distributor buys supplies at 1.00 a unit and receives warrants with a grant-date fair value of 50,000.00 that vest if it buys at least 1,000,000.00 in two years. The booking carries the promise as consideration_payable with share_based true, measured by a SHARE_BASED_CONSIDERATION estimate (grant_date, grant_date_fair_value, vesting_probable; expected related revenue 1,000,000.00). The cumulative reduction is the fair value × (1 when vesting is probable, else 0) × posted cumulative related REVENUE ÷ expected related revenue, capped at the fair value; invoices never drive it (POLICIES PT-10 rev 1.7; ENGINE_SPEC S04-R-17 rev 1.6; ENGINE_SPEC_B S10-R-26; D-91 C606-03). JET-14 posts the period change Dr REVENUE / Cr BILLING_CLEARING (EQUITY). Fair value 33,333.33 over expected related revenue 900,000.00; deliveries of 123,457, 456,789 and 419,754 units at 1.00 (cumulative 1,000,000.00, above the expected 900,000.00). The exact cumulative reduction is 33,333.33 × 123,457 ÷ 900,000 = 137174430727/30000000 (posted 4,572.48), then 322358856653/15000000 (posted 21,490.59), then the cap 33,333.33; the equity credits are the deltas 4,572.48, 16,918.11 and 11,842.74 (CV-35: round the exact cumulative once, never the deltas)."
