schema: erev-answer-key/1
id: CPC-WM-03-BUYER-PROMOTIONS-NEGATIVE-REVENUE-TEST
title: "Platform-funded buyer promotions as consideration payable to a customer, tested against revenue from buyers"
status: active
families: [CPC, POB]
tags: [portfolio]
summary: "research 05 §17. Buyers are Wayfarer's customers under the terms of service and pay a 2% buyer service fee (20,000.00 in the first quarter of 2026, invoiced monthly 6,000.00 / 6,600.00 / 7,400.00). On 1 January Wayfarer commits a first-quarter promotion budget funding checkout coupons for buyers; the coupons pay no distinct good or service, so they are consideration payable to a customer and reduce revenue (606-10-32-25). Expected promotions 15,000.00 against expected buyer fees 20,000.00: an incentive asset is recognised when promised and released at 75% of each buyer-fee invoice (JET-14; POL-049). Negative-revenue test (research 05 §17 pitfall 3): promotions do not exceed revenue from buyers, so revenue is reduced to 5,000.00 and nothing is reclassified to expense. Encoding of the promise follows the EXPECTED_PURCHASES convention of CPC-BR-07-CASEB. The version memo consideration_payable_amount carries the member sign, −15,000.00, and the obligation keeps the gross allocation 20,000.00, so Σ allocated_amount = transaction_price − consideration_payable_amount (ENGINE_SPEC S04-R-02 rev 1.3; 04 DB-17 V1; ADJUDICATION.md R-SGN-01)."
