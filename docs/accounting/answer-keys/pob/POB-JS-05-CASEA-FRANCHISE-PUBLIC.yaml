summary: "research 05 §13 worked example. Store opens 1 January 2026; 10-year franchise term; initial fee 50,000.00 invoiced at opening; equipment package 30,000.00 (SSP 30,000.00) delivered 10 January; royalties 6% and advertising fund contributions 2% of franchisee sales (1,200,000.00 in 2026, reported quarterly) follow the sales-based royalty exception (606-10-55-65) and are principal revenue. Case A (public franchisor, no expedient): pre-opening services are not distinct from the symbolic licence; fixed consideration 80,000.00 allocated licence 50,000.00 and equipment 30,000.00; the fee is recognised 5,000.00 a year. 2026 revenue 131,000.00; contract liability for the initial fee 45,000.00 at year end."
