summary: "research 05 §17 worked example. Wayfarer Marketplace Ireland sells from its own inventory: it holds inventory risk, sets prices and is responsible for fulfilment, so it controls the goods before transfer and is principal (606-10-55-37A(a)); revenue is gross. First-quarter 2026 orders of EUR 300,000.00 are paid at checkout (90,000.00 / 100,000.00 / 110,000.00). Control transfers on delivery: EUR 6,000.00 of March orders are still in transit on 31 March and are delivered on 2 April, so they remain a contract liability at quarter end. No supplier-clearing line exists."
