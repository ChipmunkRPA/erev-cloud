title: "Licence paid monthly with a significant financing component; renewal licence gated to the renewal period start"
status: "active"
families: ["POB", "SFC", "REC"]
summary: "A 24-month software licence (functional intellectual property) transfers on 1 January 2026 for 24 monthly payments of 10,000.00 from 31 January 2026. The customer's borrowing rate is 6% a year (override: CUSTOMER_CREDIT_RATE, 0.06, MONTHLY; payment_schedule of 24 points), so revenue at transfer is the cash selling price 225,628.66 and JET-11a accretes interest income on the exact financed balance: 1,128.14 in January 2026 and 14,371.34 in total (ENGINE_SPEC S04-R-12). On 31 December 2026 the customer signs a renewal for 2028 and 2029 on the same terms; the renewal contract names the original through renewal_of (REQ-MOD-017). Revenue for a renewal licence cannot begin before the renewal period starts (606-10-55-58C; POL-025 RENEWAL_PERIOD_START at book level), so the renewal's 225,628.66 is recognised on 1 January 2028 although the software is already available. The debit positions are unbilled receivables because the rights are unconditional (ALG-03): 216,756.80 after each licence's first month."
