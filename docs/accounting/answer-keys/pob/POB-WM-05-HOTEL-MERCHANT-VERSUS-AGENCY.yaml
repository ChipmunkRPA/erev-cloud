schema: erev-answer-key/1
id: POB-WM-05-HOTEL-MERCHANT-VERSUS-AGENCY
title: "Hotel bookings under the merchant and agency models: agent revenue net in both, timing at check-in"
status: active
families: [POB, REC, POS]
tags: []
summary: "Wayfarer sells hotel stays for March 2026. Merchant model: travellers prepay 120,000.00 to Wayfarer in February and Wayfarer pays the hotels net rates of 100,800.00. Wayfarer does not control the rooms before the stay (no committed inventory, the hotel provides the service and bears cancellation risk under the programme terms), so even as merchant of record it is an agent: revenue is the 19,200.00 margin, and the hotel payable goes to BILLING_CLEARING (AP_SUPPLIER) (606-10-55-38; research 05 §18 pitfall 4). Agency model: hotels collect 80,000.00 directly and pay Wayfarer a 10% commission of 8,000.00, invoiced to the hotels on 10 April. Under both programmes bookings can be cancelled free of charge until check-in, so Wayfarer's service is complete at check-in (judgement): revenue in March. The agency commission earned but not invoiced at 31 March is an unconditional right, presented as an unbilled receivable."
