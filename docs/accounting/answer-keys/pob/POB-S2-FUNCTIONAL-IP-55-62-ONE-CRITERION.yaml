id: "POB-S2-FUNCTIONAL-IP-55-62-ONE-CRITERION"
title: "Functional IP meeting only one 606-10-55-62 criterion stays a right to use recognised at availability (D-91 (viii))"
status: "active"
families: ["POB", "REC"]
summary: "A 12,000.00 annual licence of functional intellectual property invoiced at inception, available 1 January 2026. The reviewed ASC606 LICENCE_NATURE record answers 606-10-55-62(a) true (the functionality is expected to change substantively) but (b) false (the customer is not required to use the updated IP), so the exception does not apply (S03-R-10 rev 1.6; D-91 gaps (viii)): the licence is a right to use, POINT_IN_TIME, and the whole 12,000.00 is recognised in January when the copy is available (606-10-55-58B, 55-63). The stored members are read, never ignored; with both true the same licence would be a right to access (POB-S2-FUNCTIONAL-IP-55-62-ACCESS)."
