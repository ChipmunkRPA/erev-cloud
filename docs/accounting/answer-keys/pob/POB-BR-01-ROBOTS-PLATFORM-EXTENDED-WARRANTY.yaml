schema: erev-answer-key/1
id: POB-BR-01-ROBOTS-PLATFORM-EXTENDED-WARRANTY
title: "Robots with embedded firmware, platform subscription and a service-type extended warranty"
status: active
families: [POB, ALC, REC]
tags: []
summary: "research 05 §4 worked example. On 1 January 2026 a customer buys 100 robots with essential embedded firmware (one combined POB, delivered 5 January), a 24-month platform subscription (2026 to 2027) and, in the same negotiation, an extended warranty for years 2 and 3 that provides services beyond assurance (service-type POB, 2027 to 2028). Everything is invoiced 118,000.00 on delivery. Stated prices 85,000.00 / 25,000.00 / 8,000.00; SSPs 90,000.00 / 30,000.00 / 8,000.00. The warranty order is combined with the robot order (606-10-25-9(a)) and booked as one contract, so the discount is allocated over all three POBs by relative SSP: 82,968.75 / 27,656.25 / 7,375.00. Research 05 kept 82,500 / 27,500 / 8,000, which requires an approved 32-37 discount exception (discrepancy recorded in the coverage file). The assurance-type warranty accrual is an ERP posting here (POL-022 EXTERNAL at entity level)."
