summary: "A nonpublic franchisor charges a 50,000.00 initial fee for a 10-year franchise licence (symbolic IP, over time) and pre-opening training and site selection within the 952-606-25-2 list. With the expedient (POL-202 ELECT_DISTINCT_SERVICES) the services are a distinct POB: SSPs 15,000 and 40,000 give 13,636.36 and 36,363.64. The services are performed by 30 June 2026. The licence is recognised by whole months with cumulative rounding of the exact allocation (D-11a): annual amounts 3,636.37 in years 2, 5, 7 and 10 and 3,636.36 otherwise; year 1 revenue 17,272.72. POLICIES CHK-006 places the extra cents in years 2, 4, 7 and 9 (round of posted allocation x progress); see the coverage file. Cross-slice variants with distinct inputs, kept: RND-CHK-006-S12-FRANCHISOR-OWN-LICENCE-TEN-YEARS (different events and policies) (ADJUDICATION.md R-DUP-02)."
