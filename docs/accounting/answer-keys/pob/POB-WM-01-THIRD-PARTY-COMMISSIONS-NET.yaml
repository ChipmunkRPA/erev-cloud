schema: erev-answer-key/1
id: POB-WM-01-THIRD-PARTY-COMMISSIONS-NET
title: "Third-party marketplace orders: agent commission presented net, payment service presented gross"
status: active
families: [POB, REC, JE]
tags: [portfolio]
summary: "research 05 §17 worked example, first quarter of 2026. Wayfarer is merchant of record for third-party sellers: buyers pay the platform 1,000,000.00 of gross merchandise value (300,000.00 / 330,000.00 / 370,000.00 by month), and the platform keeps a 15% commission. The specified good is the seller's product, which Wayfarer never controls (no inventory risk, no pricing discretion): Wayfarer is an agent and revenue is the commission (606-10-55-38): 45,000.00 / 49,500.00 / 55,500.00. The gross amount relieves the contract liability and the seller payable of 850,000.00 goes to BILLING_CLEARING with clearing_purpose AP_SUPPLIER (JET-02 agent case, POL-030). Wayfarer also provides its own payment processing service to sellers for 3% (30,000.00), which it controls: principal, gross revenue, invoiced monthly by deduction from payouts. GMV is a memo measure."
