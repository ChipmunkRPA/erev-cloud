summary: "A sports team licenses its name and logo for 2026: symbolic IP, a right to access recognised over time (606-10-55-59, 55-60). Fixed fee 2,000,000.00 invoiced in advance; royalty 5% of licensee sales. Q1 sales of 1,000,000.00 are reported at 31 March (royalty statement 50,000.00) and recognised because the sales occurred and the POB is partially satisfied (606-10-55-65). Fixed-fee revenue by whole months, cumulatively rounded: 166,666.67 / 166,666.66 / 166,666.67, 500,000.00 for Q1. The contract is one presentation unit (D-12, POL-120): at 31 March the position is billed 2,000,000.00 less revenue 550,000.00, a contract liability of 1,450,000.00; research 04 showed 1,500,000.00 of liability and a separate 50,000.00 receivable (see coverage discrepancies). The royalty invoice follows on 10 April."
