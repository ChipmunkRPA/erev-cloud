schema: "erev-answer-key/1"
id: "POB-S2-FUNCTIONAL-IP-55-62-ACCESS"
title: "Functional IP meeting both 606-10-55-62 criteria on a reviewed ASC606 record is a right to access recognised over the licence period (D-91 (viii))"
status: "active"
families: ["POB", "REC"]
summary: "Two 12,000.00 annual licences of functional intellectual property (1 January to 31 December 2026, invoiced 12,000.00 at inception, ERP billing). Each carries a reviewed ASC606 LICENCE_NATURE record answering both 606-10-55-62 criteria true: the functionality is expected to change substantively through the licensor's activities that transfer no promised good or service, and the customer is required to use the updated IP. Under POL-024 FUNCTIONAL_SYMBOLIC (S03-R-10 rev 1.6) the licence is therefore a right to access, OVER_TIME TIME_ELAPSED under MONTHLY_EVEN: C-LIC-JAN, available 1 January, recognises 1,000.00 a month (100,000 minor); C-LIC-FEB, available 1 February (55-58C), recognises over the eleven remaining months, 1,090.91 in February (12,000.00 x 1/11 = 109,091 minor) and 12,000.00 by year end. Without the record, or with one criterion alone, the licence is a right to use recognised at availability (POB-S2-FUNCTIONAL-IP-55-62-ONE-CRITERION)."
