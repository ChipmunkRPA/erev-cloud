title: "Series of daily management services; 1% fee allocated to the month earned (FASB Example 12A)"
status: "active"
families: ["POB", "REC", "VC"]
summary: "A 20-year hotel management contract is one series POB (606-10-25-14(b), 25-15). The fee is 1% of monthly hotel revenue; it relates specifically to each month's service and allocating it to that month meets the allocation objective, so it is allocated entirely to the distinct month (606-10-32-39(b), 32-40) and recognised as earned, without spreading an estimate over 20 years. January hotel revenue 2,000,000.00 gives 20,000.00; February 1,500,000.00 gives 15,000.00. The fee is invoiced at each month end, so no contract asset or liability remains."
