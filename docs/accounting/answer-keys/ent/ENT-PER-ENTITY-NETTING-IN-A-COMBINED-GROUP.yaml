id: ENT-PER-ENTITY-NETTING-IN-A-COMBINED-GROUP
title: "Combination across two legal entities: one allocation, no netting across entities"
status: active
families: [ENT, POS, ALC]
tags: [multi-entity]
summary: >-
  Two contracts with the same customer are combined under 606-10-25-9(a): C-ENT-A contracted by US01 (12-month
  support, stated 12,000.00, SSP 15,000.00, invoiced 12,000.00 upfront) and C-ENT-B contracted by US02 (installation,
  stated 10,000.00, SSP 7,500.00, transferred on 2026-01-20, not yet invoiced). Allocation spans the group in one
  currency (ALG-07 step 1): 22,000.00 × 15,000 ÷ 22,500 = 14,666.67 and 7,333.33 by largest remainder. Netting runs
  per (group, contracting entity, book) (POL-120): at 31 January US01 presents a contract liability of 12,000.00 −
  1,222.22 = 10,777.78 and US02 a contract asset of 7,333.33 [A CONDITIONAL]. The legacy contract-level netting across
  entities (3,444.45 liability) is not reproduced (REQ-ENT-002). The checkpoint also asserts the group's labelled
  balances per legal entity through the block groups (dev-guide DG-AK-57; ADJUDICATION.md R-SCH-05).
