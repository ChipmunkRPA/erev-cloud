summary: >-
  PRD world contract WLD-K-04 re-anchored. UK01 (functional GBP) contracts GBP 68,000.00 on 2026-04-01: O1 platform
  subscription 60,000.00 (SSP 60,000.00, DAILY over 2026-04-01 to 2027-03-31) performed by US01 (functional USD), and
  O2 implementation 8,000.00 (SSP 10,000.00) performed by UK01, 50% on 2026-04-30 and 100% on 2026-05-31; invoiced
  68,000.00 upfront (ERP). Allocation 58,285.71 / 9,714.29. Every O1 period amount posts JET-13 in GBP: UK01 Dr
  CONTRACT_LIABILITY / Cr INTERCOMPANY_DUE_TO (US01) with functional = the GBP relief, and US01 Dr
  INTERCOMPANY_DUE_FROM (UK01) / Cr REVENUE with functional USD at US01's average GBP/USD rate for the period
  (POL-162, POL-171; ALG-07 step 5). September 2026: O1 schedule 29,222.70 − 24,432.09 = 4,790.61, the pair GBP
  4,790.61 = USD 6,155.93 at 1.2850. Remeasurement of the intercompany balances belongs to the ERP (ALG-07 step 5).
