schema: "erev-answer-key/1"
id: ENT-CHK-071-CONTRACT-ASSET-HELD-BY-CONTRACTING-ENTITY
title: >-
  No invoice by P1 end: the contract asset sits in the contracting entity; the performer holds only the due-from
status: active
families: [ENT, JE]
tags: [multi-entity]
summary: >-
  The CHK-070 facts with no invoice by the end of P1 and payment due only on completion [A], so both obligations carry
  the CONDITIONAL class. US01 recognises 60,000.00 and relieves 20,000.00 to UK01 through JET-13; NP for (contract,
  US01, ASC606) = −80,000.00, presented as an 80,000.00 contract asset in US01 and apportioned to the licence
  60,000.00 and the implementation 20,000.00 under POB_DEBIT_POSITIONS. UK01 recognises 20,000.00 of revenue against a
  20,000.00 due-from and holds no contract balance (ALG-07 step 3, CHK-071).
