summary: >-
  Transaction price 100,000.00 (USD, one currency). The licence (60,000.00) is contracted and performed by US01 and
  transfers in P1; the implementation (40,000.00) is contracted by US01 and performed by UK01 [A: UK01 has USD
  functional currency], 50% complete at the end of P1. US01 invoices 100,000.00 at inception (ERP). Under POL-170
  PERFORMING_ENTITY, US01 posts JET-02 Dr CONTRACT_LIABILITY 60,000.00 / Cr REVENUE 60,000.00 and JET-13 Dr
  CONTRACT_LIABILITY 20,000.00 / Cr INTERCOMPANY_DUE_TO (counterparty UK01) 20,000.00; UK01 posts Dr
  INTERCOMPANY_DUE_FROM (counterparty US01) 20,000.00 / Cr REVENUE 20,000.00. Each entity's batch balances on its own;
  US01 presents a 20,000.00 contract liability and UK01 holds no contract balance (CHK-070). Eliminations belong to
  consolidation (810-10-45-1).
