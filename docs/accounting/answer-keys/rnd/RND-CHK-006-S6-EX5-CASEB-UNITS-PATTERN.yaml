summary: >-
  Rounding pattern of the post-modification pool of FASB Example 5 Case B (8,400.00 over 90 units). [A] To isolate
  ALG-01 the pool is booked as one 90-unit point-in-time line of 8,400.00; the 25-13(a) route and the 900.00 credit
  belong to the MOD family (CHK-028). Units 1, 2 and 3 post 93.33 / 93.34 / 93.33 (cumulative round(8,400 × n ÷ 90));
  5,600.00 after 60 units and 8,400.00 after 90. Cross-slice variants with distinct inputs, kept:
  MOD-CHK-028-S6-EX5-CASEB (different modification inputs) (ADJUDICATION.md R-DUP-02).
