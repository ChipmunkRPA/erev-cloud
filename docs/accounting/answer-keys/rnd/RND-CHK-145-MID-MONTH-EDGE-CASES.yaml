title: "ALG-11 MID_MONTH edge cases: fallback period and inclusive thresholds"
status: active
families: [RND, REC]
tags: [subscription]
summary: >-
  (a) 500.00 over 2026-01-20 to 2026-02-10 counts no period by the rule, so the fallback counts February 2026: January
  0.00, February 500.00. (b) 500.00 over 2026-01-05 to 2026-01-10 falls back to January 2026. (c) 1,300.00 over
  2026-01-15 to 2027-01-15: both thresholds are inclusive, m = 13, 100.00 in every period from January 2026 to January
  2027.
