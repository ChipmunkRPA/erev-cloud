schema: "erev-answer-key/1"
id: RND-CHK-001-USD-EQUAL-SSP-THIRDS
title: >-
  Largest remainder: USD 100.00 over three obligations with equal SSP gives 33.34 / 33.33 / 33.33
status: active
families: [RND, ALC]
tags: []
summary: >-
  One contract, entity US01, USD, ASC606 book. Three point-in-time kits with stated prices 40.00, 30.00 and 30.00 and
  equal observable SSPs of 20.00 (transaction price 100.00). Each exact quota is 33.333…; the one remaining cent goes
  to the first obligation key because the fractional remainders and the weights tie (ALG-01 §2.1.2). The 100.00
  invoice is ingested (billing.posting ERP) and attributed by the same apportionment, so after all three kits transfer
  no netting reclass arises. Cross-slice variants with distinct inputs, kept: RND-CHK-001 (different contract, prices
  and events) (ADJUDICATION.md R-DUP-02).
