title: >-
  Largest remainder of a negative total: an unreferenced 100.00 credit memo over three equal allocations
status: active
families: [RND, POS]
tags: []
summary: >-
  Entity US01, USD, ERP billing. Three services of 100.00 each with equal SSPs (allocations 100.00 each). Invoices of
  100.00 reference each obligation. A credit memo of 100.00 references no obligation, so ALG-02 step 3 attributes it
  by ALG-01 over the allocations of the obligations it covers. The signed total −100.00 apportions to −33.34 / −33.33
  / −33.33 (sign applied after the apportionment of |T|, CHK-003c), so the billed amounts by obligation become 66.66 /
  66.67 / 66.67. [J] Attribution is per billing document, not over cumulative billing; see the coverage file OQ-AK-03.
  Cross-slice variants with distinct inputs, kept: RND-CHK-003C (price concession on satisfied POBs versus a credit
  memo) (ADJUDICATION.md R-DUP-02).
