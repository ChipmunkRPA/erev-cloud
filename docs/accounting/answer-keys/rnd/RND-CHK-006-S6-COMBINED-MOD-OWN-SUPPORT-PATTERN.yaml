title: "Research 04 S6-COMBINED-MOD-OWN support rounding pattern: 70,000.00 over 36 months"
status: active
families: [RND, REC]
tags: [r04-s6]
summary: >-
  Rounding pattern of the post-modification support obligation (allocation 50,000.00 plus the added year at 20,000.00
  = 70,000.00 over the 36 months after the modification). [A] To isolate ALG-01 the support is booked as one 36-month
  time-elapsed line of 70,000.00 from 2026-01-01; the modification route and the installation catch-up belong to the
  MOD family (CHK-042). Cumulative rounding of 70,000 × k ÷ 36 gives month 1 = 1,944.44 and twenty months of 1,944.44
  against sixteen of 1,944.45 (CHK-006 row S6-COMBINED-MOD-OWN). Cross-slice variants with distinct inputs, kept:
  MOD-S6-COMBINED-MOD-OWN (different modification inputs) (ADJUDICATION.md R-DUP-02).
