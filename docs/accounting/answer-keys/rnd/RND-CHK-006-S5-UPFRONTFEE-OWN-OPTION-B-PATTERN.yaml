summary: >-
  Rounding pattern of option B: a 12-month subscription of 12,000.00 and a nonrefundable set-up fee of 3,000.00
  recognised over the 36-month expected benefit period (POL-029), invoiced together at inception. [A] To isolate the
  ALG-01 pattern the fee's benefit period is booked as a distinct time-elapsed line with SSP equal to its price; the
  material-right analysis itself belongs to the MR family. Cumulative fee revenue round(3,000 × k ÷ 36) gives 83.34 in
  months 2, 5, 8 and 11 and 83.33 otherwise in year 1; year-1 revenue 13,000.00 and the year-end contract liability
  2,000.00. Cross-slice variants with distinct inputs, kept: REC-S5-UPFRONTFEE-OWN-B (different lines and policies)
  (ADJUDICATION.md R-DUP-02).
