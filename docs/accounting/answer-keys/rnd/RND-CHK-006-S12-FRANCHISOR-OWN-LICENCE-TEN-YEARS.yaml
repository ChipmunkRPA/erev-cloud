summary: >-
  Initial franchise fee 50,000.00 with pre-opening services (SSP 15,000) and a ten-year symbolic franchise licence
  (SSP 40,000) [A stated 10,000 / 40,000; both distinct, as research 04 concludes under the franchisor expedient].
  Allocation 13,636.36 / 36,363.64; services complete during 2026 (output 100% on 2026-12-31). The licence runs
  2026-01-01 to 2035-12-31 by whole months; cumulative revenue rounds X × k ÷ 120 with X = 36,363.6363…. Year totals
  are 3,636.37 in years 2, 5, 7 and 10 and 3,636.36 otherwise; year-1 revenue 17,272.72. POLICIES CHK-006 lists
  3,636.37 in years 2, 4, 7 and 9 and licence_year10 3,636.36 (round(A × f)); see discrepancy D-AK-02. Cross-slice
  variants with distinct inputs, kept: POB-S12-FRANCHISOR-OWN (different events and policies) (ADJUDICATION.md
  R-DUP-02).
