summary: >-
  Equipment (SSP 10,000) and a service-type extended warranty (SSP 1,000) sold for 10,500.00 [A stated 10,000.00 and
  500.00]. Exact allocation of the warranty X = 10,500 × 1,000 ÷ 11,000 = 954.5454…; posted A = 954.55 (larger
  fractional remainder). The warranty runs months 13 to 24 (2027-01-01 to 2027-12-31, MONTHLY_EVEN). Cumulative
  posting rounds X × k ÷ 12 (D-11a, ALG-01 §2.1.3) and aligns month 24 to A. This key asserts 79.55 in months 13, 15,
  17, 19, 21, 23 and 24 and 79.54 in months 14, 16, 18, 20 and 22. POLICIES CHK-006 lists 79.55 in months 13, 15, 17,
  18, 20, 22, 24 and 79.54 in 14, 16, 19, 21, 23, which is round(A × k ÷ 12), the rule D-11a rejects; see discrepancy
  D-AK-02 in the coverage file. Cross-slice variants with distinct inputs, kept: POB-CHK-134-S2-WARRANTY-OWN
  (assurance accrual under POL-022 ENGINE versus the schedule pattern only) (ADJUDICATION.md R-DUP-02).
