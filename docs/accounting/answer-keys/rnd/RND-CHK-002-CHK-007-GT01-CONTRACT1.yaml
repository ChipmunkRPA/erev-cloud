summary: >-
  Legacy-parity preset, entity ME1, USD. Golden Contract 1 (step 02): Hardware 1 5 × 100.00 list, 10% midpoint
  discount, ±15% range, stated 500 (in range); Software 1 2 units, stated 400 above the 368 high bound (clamped,
  POL-072 NEAREST_BOUND); Consulting 1 stated 400 with point SSP 150; the hardware material right with the
  dollar-quantity convention (SSP 1,000). Transaction price 1,300.00 is apportioned by largest remainder at the cent
  (CHK-002). CHK-007: Software 1 delivers one unit in January 2023 and the second in February 2023 with no
  modification; January posts round(237.066402… × 1/2) = 118.53, not round(237.07 × 1/2) = 118.54, and February aligns
  the cumulative to the posted allocation 237.07 (D-11a). A 400.00 invoice on Software 1 keeps the position a
  liability, so no reclass line appears. The February delivery is the CHK-007 hypothetical, not the golden step 05
  delivery. Cross-slice variants with distinct inputs, kept: ALC-CHK-002-GT01-GT03 (golden Contracts 1, 2 and 4 versus
  Contract 1 with CHK-007) (ADJUDICATION.md R-DUP-02).
