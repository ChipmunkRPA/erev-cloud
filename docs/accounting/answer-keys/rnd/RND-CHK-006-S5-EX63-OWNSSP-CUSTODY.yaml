  whole months. Cumulative custody revenue rounds X × k ÷ 36 with X = 29,126.2135…: year totals 9,708.74 / 9,708.74 /
  9,708.73. POLICIES CHK-006 lists 9,708.74 / 9,708.73 / 9,708.74, which is round(A × f); see discrepancy D-AK-02.
  Cross-slice variants with distinct inputs, kept: REC-S5-EX63-OWNSSP (custody periods 2027 to 2029 versus 2026 to
  2028) (ADJUDICATION.md R-DUP-02).
