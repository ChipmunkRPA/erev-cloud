        end_date: "2026-06-30"
      - obligation_key: L2-UNITS
        product_code: PROD-UNIT
        quantity: "10"
        total_price: "1200000.00"
        unit_price: "120000"
    estimates:
      - element_code: EAC-GE08-PROTO
        estimate_kind: EAC
        method: COST_BUILDUP
        obligation_key: L1-PROTO
