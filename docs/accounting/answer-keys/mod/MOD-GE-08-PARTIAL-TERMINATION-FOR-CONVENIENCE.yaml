schema: erev-answer-key/1
id: MOD-GE-08-PARTIAL-TERMINATION-FOR-CONVENIENCE
title: "Partial termination for convenience of production units: prospective reallocation of the remaining units"
status: active
families: [MOD, REC, ALC]
tags: [termination, construction]
summary: "A firm-fixed-price contract signed 1 January 2026: design and prototype (stated 1,800,000.00, SSP 1,500,000.00, cost-to-cost, EAC 1,200,000.00) and 10 production units (stated 120,000.00 each, 1,200,000.00, SSP 1,500,000.00). Allocation by relative SSP: prototype 1,500,000.00; units 1,500,000.00 (150,000.00 each). The prototype completes on 30 June; 2 units are delivered on 30 September. On 31 October the customer terminates 5 of the remaining 8 units for convenience; the contract price falls by 600,000.00 (5 × 120,000.00). A scope reduction is never a separate contract; the remaining units are distinct, so 25-13(a) applies: pool = remaining allocation 1,200,000.00 − 600,000.00 = 600,000.00 for 3 units (200,000.00 each); no catch-up on the satisfied prototype (ALG-04). The last 3 units are delivered on 15 December. Billing: prototype 1,800,000.00 on completion; units 120,000.00 each on delivery."
