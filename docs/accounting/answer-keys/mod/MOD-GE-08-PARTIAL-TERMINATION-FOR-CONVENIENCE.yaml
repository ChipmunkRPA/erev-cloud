            effective_date: "2026-01-01"
            expected_total_amount: "1200000.00"
            currency: USD
            rationale: "Prototype plan."
    modifications:
      - reference: MOD-GE08-T4C
        effective_date: "2026-10-31"
        # D-93 (2): a termination for convenience that reduces units within an obligation is a
        # scope-reducing modification (606-10-25-12/13); the terms line carries the post-modification
        # terms (5 units in force, 3 remaining after the 2 delivered). CONTRACT_TERMINATED PARTIAL
        # selects whole obligations (S06-R-21) and is not the event shape here.
        kind: QUANTITY_CHANGE
        price_change_amount: "-600000.00"
        lines:
          - obligation_key: L2-UNITS
            product_code: PROD-UNIT
            quantity: "5"
            total_price: "600000.00"
            unit_price: "120000"
