summary: "research 05 §2 worked example re-anchored: 12-month subscription 120,000.00 (SSP 132,000.00) invoiced in advance and implementation 15,000.00 (SSP 18,000.00) invoiced on completion; allocation 118,800.00 and 16,200.00. Implementation progress on labour hours (200 of 500 hours in January, complete in February). At 31 March the subscription carries a liability of 90,300.00 and the implementation an asset of 1,200.00; the contract presents one net contract liability of 89,100.00 (ALG-02). On 1 July the customer adds 50 seats for the remaining six months (mod-date SSP 33,000.00). Case B: the seats are priced at 26,400.00 (20% below SSP), so 25-12(b) fails and the remaining services are distinct: termination and creation of a new contract (606-10-25-13(a)). Pool = unrecognised subscription allocation 59,400.00 + 26,400.00 = 85,800.00, apportioned on modification-date SSPs of the remaining increments (66,000.00) and the added seats (33,000.00, the stated price clamped to the SSP point under POL-072): 57,200.00 and 28,600.00, recognised over July to December with cumulative rounding. No catch-up; the satisfied implementation POB is untouched (D-18, ALG-04)."
