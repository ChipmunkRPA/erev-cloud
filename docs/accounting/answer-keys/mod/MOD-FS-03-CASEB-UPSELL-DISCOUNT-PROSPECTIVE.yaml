schema: erev-answer-key/1
id: MOD-FS-03-CASEB-UPSELL-DISCOUNT-PROSPECTIVE
title: "Upsell of distinct seats at a discount accounted for prospectively (25-13(a))"
status: active
families: [MOD, ALC, REC]
