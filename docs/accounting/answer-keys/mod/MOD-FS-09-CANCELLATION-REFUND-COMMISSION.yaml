tags: [termination, subscription]
summary: "A 24-month subscription (2026 to 2027, 192,000.00) is invoiced 96,000.00 on 1 January of each year. The sales commission of 14,400.00 is incremental and capitalised; the renewal commission is not commensurate, so the asset is amortised over the initial term plus one expected renewal, 36 months straight line (POL-141, estimate RENEWAL_EXPECTATION), 400.00 a month. The customer terminates for convenience effective 31 March 2027 and is owed a refund of 72,000.00 for April to December 2027. The termination is a modification that removes the remaining service (POLICIES PT-03): pool = 72,000.00 − 72,000.00 = 0.00. JET-04b records the refund liability until the credit memo of 10 April 2027 (POL-242). The remaining commission asset has no remaining benefit and is expensed (JET-09e, POL-145): 8,400.00 in March 2027. The modification lines show the post-termination terms (term to 31 March 2027, price 120,000.00)."
