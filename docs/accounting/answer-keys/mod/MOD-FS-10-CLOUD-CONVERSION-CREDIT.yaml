schema: erev-answer-key/1
id: MOD-FS-10-CLOUD-CONVERSION-CREDIT
title: "Conversion of a term licence with PCS to SaaS with a credit for unused PCS, accounted for prospectively"
status: active
families: [MOD, ALC, REC]
tags: [subscription]
summary: "On 1 January 2026 the customer buys a three-year term licence (90,000.00, functional, transferred on 1 January 2026) and three years of PCS (30,000.00), invoiced 120,000.00; SSPs equal the prices. On 1 January 2027 the customer converts to the hosted service for 2027 and 2028: SaaS list value 100,000.00 less a conversion credit of 20,000.00 for unused PCS, invoiced 80,000.00. The customer gives up the on-premise rights with no refund; the conversion right was not a material right at inception, so licence revenue is not reversed. The remaining SaaS and the removed PCS are distinct from what was transferred: termination and new contract (606-10-25-13(a)). Pool = unrecognised PCS allocation 20,000.00 + 80,000.00 = 100,000.00, all apportioned to the SaaS POB (the removed PCS has no remaining quantity and weight 0), recognised 4,166.67 / 4,166.66 a month."
