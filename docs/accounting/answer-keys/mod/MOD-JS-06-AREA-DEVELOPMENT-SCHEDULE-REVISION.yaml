schema: erev-answer-key/1
id: MOD-JS-06-AREA-DEVELOPMENT-SCHEDULE-REVISION
title: "Area development agreement: fee is a prepayment for future store licences; schedule revision accounted for prospectively"
status: active
families: [MOD, POB, REC, ALC]
tags: []
summary: "An area developer signs on 1 January 2026 for the exclusive right and obligation to open three stores (July 2026, July 2027, July 2028) and pays a nonrefundable development fee of 90,000.00; each store's franchise agreement also requires 10,000.00 at opening, so each 10-year store licence carries 40,000.00 (the standard initial fee and SSP). The development right transfers nothing on its own: the fee is a prepayment for the future licences, recognised over each licence term from opening (research 05 §13 pitfall 3). Store 1 opens 1 July 2026 (333.33 a month). On 1 October 2026 the schedule is revised to two stores: store 3 is removed and its 10,000.00 opening fee falls away; the development fee is not refunded. The remaining store-1 increments and store 2 are distinct: 25-13(a). Pool = (40,000.00 − 1,000.00) + 40,000.00 + 40,000.00 − 10,000.00 = 109,000.00 over modification-date SSPs of the remaining increments (39,000.00 and 40,000.00): 53,810.13 and 55,189.87."
