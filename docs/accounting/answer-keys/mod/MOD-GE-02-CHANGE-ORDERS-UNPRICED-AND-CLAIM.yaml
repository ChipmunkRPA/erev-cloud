summary: "Highway interchange for 5,000,000.00 (single POB, cost-to-cost, EAC 4,000,000.00). 30 June 2026: costs 1,600,000.00; approved change order CO-1 adds 300,000.00 of price and 250,000.00 of cost; not distinct, so 25-13(b): allocation 5,300,000.00, progress 1,600,000 ÷ 4,250,000, catch-up −4,705.88. 30 September: CO-2 approves added drainage scope with the price undetermined; cost +200,000.00; the price change is VC estimated by most likely amount 240,000.00 and constrained to 180,000.00 (606-10-25-11; POL-105; POLICIES PT-05). 30 November: a claim for owner-caused delay of 400,000.00 is attested enforceable (POL-244); most likely 150,000.00, constrained to 100,000.00. 31 December: CO-2 is priced at 220,000.00 and the claim settled at 120,000.00 (final estimate versions; ALG-10 catch-up). Work completes on 31 March 2027. Progress billings 1,800,000.00 / 2,600,000.00 / 1,240,000.00; revenue ahead of billing is a contract asset. Covers research 04 §6.1 (list B COV-B-32)."
