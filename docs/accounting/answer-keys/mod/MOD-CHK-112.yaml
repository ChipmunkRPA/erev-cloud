summary: "A 24-month subscription billed 120,000.00 a year in advance; a 36,000.00 commission is capitalised and amortised over 36 months (renewal commissions not commensurate). At the end of month 18 (30 June 2027) the customer terminates and receives a 60,000.00 refund for months 19 to 24. The termination reduces scope (never a separate contract): pool = 60,000.00 unrecognised - 60,000.00 refund = nil, so no POB remains and revenue stays at 180,000.00. JET-04b posts a refund liability of 60,000.00 until the credit memo on 15 July, then releases it (POL-242). JET-09e expenses the remaining carrying amount of 18,000.00 after June's amortisation (POL-145). Final position nil; cost asset nil."
