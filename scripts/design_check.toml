# Design-check configuration (docs/design/DESIGN_SYSTEM.md §12 path table; docs/dev-guide.md §0.5).
# Paths are repository-relative; directories end with "/". Scan paths resolve against --root, the
# fixtures against the repository that holds scripts/design_check.py.

[paths]
scan_root = "frontend/src/"
token_copy = "frontend/src/styles/tokens.css"
token_source = "docs/design/tokens.css"
icon_registry = "frontend/src/components/icons/registry.ts"
icon_directory = "frontend/src/components/icons/"
chart_directory = "frontend/src/components/charts/"
ai_directory = "frontend/src/components/ai/"
format_module = "frontend/src/lib/format/"
api_types = "frontend/src/lib/api/schema.d.ts"
fixtures = "scripts/design_check_fixtures/"
# Theme and density bootstrap (DS-DEN-01); not scanned.
theme_bootstrap = "frontend/public/theme-init.js"

# DS-LINT-21 self-test: each fixture is scanned as `path` and must yield exactly `expect`.

