id: DISC-CATCH-UP-BY-CAUSE-ESTIMATE-CHANGE-AND-MODIFICATION
title: >-
  Rollforward drivers: an estimate catch-up and a modification catch-up in one period, reported separately
status: active
families: [DISC, MOD, VC]
tags: [r04-s10, r04-s6]
summary: >-
  Own example [A]. Entity US01, USD, ERP billing. A single construction obligation (fixed 100,000.00, output measure)
  is 50% complete on 2026-03-31 (revenue 50,000.00). In April: (1) a completion bonus estimate moves from 0.00 to
  10,000.00 (version 2 effective 2026-04-10) while progress is 50%: JET-04a 5,000.00, catch_up_estimate_cum 5,000.00;
  (2) the customer agrees a 20,000.00 price increase for the same scope (modification MOD-DISC-01 effective
  2026-04-20; the obligation is partially satisfied and its remaining goods are not distinct, so ALG-04 proposes
  CUMULATIVE_CATCH_UP): JET-05a round(130,000 × 50%) − 55,000.00 = 10,000.00, catch_up_modification_cum 10,000.00; (3)
  progress reaches 60% on 2026-04-30: progress revenue 13,000.00. April revenue 28,000.00, of which 15,000.00 relates
  to performance satisfied in previous periods (ALG-10 §2.11.3: ΔX × f(s) = 10,000 × 50% + 20,000 × 50%). Invoices
  60,000.00 (March) and 40,000.00 (April) leave a 22,000.00 contract liability. The contract-balance rollforward and
  50-10 narrative separate the two causes (REQ-MOD-015, REQ-RPT-006).
