# Alembic configuration (docs/dev-guide.md §6.5 DG-MIG-01).
# Revisions are handwritten with `make revision MSG=… ITEM=…`; autogenerate is never used (DG-MIG-02).
# The owner database URL comes from erev_api.config Settings in env.py, never from this file.

[alembic]
script_location = %(here)s/erev_api/db/migrations
prepend_sys_path = %(here)s
path_separator = os
